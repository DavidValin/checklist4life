  const switcherPanel = $('#switcherPanel');
  const switcherToggle = $('#switcherToggle');

  function renderSwitcher() {
    $('#switcherList').innerHTML = listChecklists().map((c) => {
      const s = checklistStats(c);
      const active = c.id === checklist.id;
      const info = [plural(s.stages, 'stage'), `${s.done}/${s.items} done`, c.updatedAt ? `updated ${formatDate(c.updatedAt)}` : '']
        .filter(Boolean).join(' · ');
      return `
        <li class="switcher__item ${active ? 'switcher__item--active' : ''}">
          <button type="button" class="switcher__select" data-action="open-checklist" data-checklist="${esc(c.id)}" ${active ? 'aria-current="true"' : ''}>
            <span class="switcher__title">${esc(c.title || 'Untitled checklist')}</span>
            <code class="switcher__id">${esc(c.id)}</code>
            <span class="switcher__info">${esc(info)}</span>
          </button>
          <button type="button" class="button button--icon button--icon-danger switcher__delete" data-action="delete-checklist" data-checklist="${esc(c.id)}" aria-label="Delete checklist “${esc(c.title)}”" title="Delete checklist">${icons.trash}</button>
        </li>`;
    }).join('');
  }

  function openSwitcher() {
    save(); // list the open checklist with its latest title/progress
    renderSwitcher();
    switcherPanel.hidden = false;
    switcherToggle.setAttribute('aria-expanded', 'true');
  }
  function closeSwitcher() {
    switcherPanel.hidden = true;
    switcherToggle.setAttribute('aria-expanded', 'false');
  }

  function openChecklist(c) {
    checklist = c;
    setActive(c.id);
    closeSwitcher();
    render();
  }

  /* ==================================================================
     Modal
     openModal({ title, subtitle, message (html-escaped), messageHTML, fields, html,
                 submitLabel, danger, cancelLabel, hideCancel, altLabel,
                 onSubmit(values, formData), onAlt(), onCancel(), onChange(name, checked) })
     ================================================================== */
  const modal = $('#modal');
  const modalForm = $('#modalForm');
  const modalBody = $('#modalBody');
  const modalSubmit = $('#modalSubmit');
  const modalCancel = $('#modalCancel');
  const modalAlt = $('#modalAlt');
  let handlers = {};

  function fieldHTML(f) {
    if (f.type === 'checkbox') {
      return `
        <label class="field field--toggle">
          <span class="field__text">
            <span class="field__label">${esc(f.label)}</span>
            ${f.hint ? `<span class="field__hint">${esc(f.hint)}</span>` : ''}
          </span>
          <input type="checkbox" role="switch" class="field__switch" name="${f.name}" ${f.value ? 'checked' : ''}>
        </label>`;
    }
    const control = f.type === 'select'
      ? `<select class="field__select" name="${f.name}">${f.options.map((o) => `<option value="${esc(o.value)}" ${String(o.value) === String(f.value) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`
      : f.type === 'textarea'
      ? `<textarea class="field__textarea ${f.tall ? 'field__textarea--tall' : ''}" name="${f.name}" placeholder="${esc(f.placeholder || '')}">${esc(f.value || '')}</textarea>`
      : `<input class="field__input" name="${f.name}" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}" ${f.required ? 'required' : ''} autocomplete="off">`;
    return `<label class="field"><span class="field__label">${esc(f.label)}</span>${control}</label>`;
  }

  function openModal(o) {
    $('#modalTitle').textContent = o.title;
    const sub = $('#modalSubtitle');
    sub.textContent = o.subtitle || '';
    sub.hidden = !o.subtitle;

    const message = o.messageHTML || (o.message ? esc(o.message) : '');
    const fields = o.fields || [];
    modalBody.innerHTML = (message ? `<p class="modal__message">${message}</p>` : '') + fields.map(fieldHTML).join('') + (o.html || '');
    modalBody.hidden = !message && !fields.length && !o.html;

    modalSubmit.textContent = o.submitLabel || 'Save';
    modalSubmit.className = 'button ' + (o.danger ? 'button--danger' : 'button--primary');
    modalSubmit.disabled = false;
    modalCancel.textContent = o.cancelLabel || 'Cancel';
    modalCancel.hidden = Boolean(o.hideCancel);
    modalAlt.textContent = o.altLabel || '';
    modalAlt.hidden = !o.altLabel;

    modal.classList.toggle('modal--wide', Boolean(o.wide));
    handlers = { submit: o.onSubmit, alt: o.onAlt, cancel: o.onCancel, change: o.onChange };
    if (!modal.open) modal.showModal();
    const first = modalBody.querySelector('input:not([type="checkbox"]), textarea');
    if (first) { first.focus(); const len = first.value.length; first.setSelectionRange(len, len); }
    else modalSubmit.focus();
  }

  // Close the modal, then run exactly one handler (it may open the next modal)
  function finishModal(kind, ...args) {
    const h = handlers[kind];
    handlers = {};
    modal.close();
    if (h) h(...args);
  }

  modalForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(modalForm);
    finishModal('submit', Object.fromEntries(formData.entries()), formData);
  });
  modalAlt.addEventListener('click', () => finishModal('alt'));
  modal.addEventListener('click', (e) => {
    if (e.target.closest('[data-modal-dismiss]') || e.target === modal) finishModal('cancel');
  });
  modal.addEventListener('cancel', (e) => { e.preventDefault(); finishModal('cancel'); }); // Escape key
  modal.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); modalForm.requestSubmit(); }
  });
  modalBody.addEventListener('change', (e) => {
    if (!handlers.change) return;
    if (e.target.type === 'checkbox') handlers.change(e.target.name, e.target.checked);
    else if (e.target.type === 'radio' && e.target.checked) handlers.change(e.target.name, e.target.value);
  });

  /* ==================================================================
     Attachments
     Files are stored as Blobs in IndexedDB (localStorage is text-only and ~5 MB).
     Items only keep { id, name, type, size }. Files no longer referenced by any
     saved checklist are garbage-collected (gcFiles).
     ================================================================== */
  const fileStore = (() => {
    let dbPromise = null;
    function db() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          if (!window.indexedDB) { reject(new Error('IndexedDB is not available in this browser.')); return; }
          const req = indexedDB.open('checklist-app', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('files', { keyPath: 'id' });
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        dbPromise.catch(() => { dbPromise = null; });
      }
      return dbPromise;
    }
    // Run `fn(store)` in one transaction; resolves with the last request's result once committed
    const run = (mode, fn) => db().then((d) => new Promise((resolve, reject) => {
      const tx = d.transaction('files', mode);
      let result;
      const req = fn(tx.objectStore('files'));
      if (req) req.onsuccess = () => { result = req.result; };
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Storage transaction aborted.'));
    }));
    return {
      putMany: (records) => run('readwrite', (s) => { records.forEach((r) => s.put(r)); }),
      get: (id) => run('readonly', (s) => s.get(id)),
      getAll: () => run('readonly', (s) => s.getAll()),
      removeMany: (ids) => run('readwrite', (s) => { ids.forEach((id) => s.delete(id)); })
    };
  })();

  const IMAGE_EXT = /\.(png|jpe?g|gif|webp|avif|bmp|svg|ico)$/i;
  function fileKind(f) {
    const type = (f.type || '').toLowerCase();
    const name = f.name || '';
    if (type.startsWith('image/') || IMAGE_EXT.test(name)) return 'image';
    if (type === 'application/pdf' || /\.pdf$/i.test(name)) return 'pdf';
    if (type.includes('zip') || /\.zip$/i.test(name)) return 'zip';
    return 'file';
  }
  const isAllowedFile = (f) => fileKind(f) !== 'file';
  function guessType(name) {
    const ext = (name.match(/\.([a-z0-9]+)$/i) || [])[1];
    const map = { pdf: 'application/pdf', zip: 'application/zip', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
      gif: 'image/gif', webp: 'image/webp', avif: 'image/avif', bmp: 'image/bmp', svg: 'image/svg+xml', ico: 'image/x-icon' };
    return map[(ext || '').toLowerCase()] || 'application/octet-stream';
  }
  function formatSize(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    const units = ['KB', 'MB', 'GB'];
    let n = bytes / 1024, u = 0;
    while (n >= 1024 && u < units.length - 1) { n /= 1024; u++; }
    return `${n < 10 ? n.toFixed(1) : Math.round(n)} ${units[u]}`;
  }
  const newFileId = () => 'f' + randomId() + randomId();
  const allAttachments = (c) => c.stages.flatMap((s) => s.items.flatMap((i) => i.attachments));

  // Object URLs for stored files (created once per session, reused for thumbnails/open)
  const fileUrls = new Map();
  const fileUrlRequests = new Map();
  function getFileUrl(id) {
    if (fileUrls.has(id)) return Promise.resolve(fileUrls.get(id));
    if (!fileUrlRequests.has(id)) {
      fileUrlRequests.set(id, fileStore.get(id)
        .then((rec) => {
          if (!rec || !rec.blob) return null;
          const url = URL.createObjectURL(rec.blob);
          fileUrls.set(id, url);
          return url;
        })
        .catch(() => null)
        .finally(() => fileUrlRequests.delete(id)));
    }
    return fileUrlRequests.get(id);
  }
  function revokeFileUrl(id) {
    const url = fileUrls.get(id);
    if (url) { URL.revokeObjectURL(url); fileUrls.delete(id); }
  }

  // After each render: load thumbnails and flag attachments whose file isn't in this browser
  function hydrateAttachments() {
    stagesEl.querySelectorAll('.attachment[data-attachment]').forEach((el) => {
      const id = el.dataset.attachment;
      getFileUrl(id).then((url) => {
        if (!el.isConnected) return;
        el.classList.toggle('attachment--missing', !url);
        const img = el.querySelector('img[data-thumb]');
        if (img && url && img.getAttribute('src') !== url) img.src = url;
      });
    });
  }

  let persistRequested = false;
  function requestPersistentStorage() {
    if (persistRequested) return;
    persistRequested = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignore */ }
  }

  const storageError = (err) => (err && err.name === 'QuotaExceededError')
    ? 'Not enough browser storage for this file.'
    : 'Could not store the file in this browser' + (err && err.message ? `: ${err.message}` : '.');

  async function addAttachments(stageId, itemId, files) {
    const allowed = files.filter(isAllowedFile);
    const rejected = files.length - allowed.length;
    if (!allowed.length) { toast('Only images, PDFs and ZIP files can be attached.', true); return; }
    const records = allowed.map((f) => {
      const name = f.name || 'file';
      return { id: newFileId(), blob: f, name, type: f.type || guessType(name), size: f.size, created: Date.now() };
    });
    try { await fileStore.putMany(records); }
    catch (err) { toast(storageError(err), true); return; }
    requestPersistentStorage();
    const item = findItem(findStage(stageId), itemId); // the checklist may have changed meanwhile
    if (!item) { scheduleGc(); return; }
    const now = new Date().toISOString();
    item.attachments.push(...records.map((r) => normalizeAttachment({ ...r, createdAt: now, updatedAt: now })));
    commit();
    toast(`Attached ${plural(records.length, 'file')}` + (rejected ? ` · ${rejected} skipped (only images, PDFs and ZIPs)` : ''), rejected > 0);
  }

  function downloadUrl(url, filename) {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  async function openAttachment(a) {
    const kind = fileKind(a);
    const url = await getFileUrl(a.id);
    if (!url) {
      toast('This file isn’t stored in this browser (e.g. it was exported without attachments).', true);
      hydrateAttachments();
      return;
    }
    if (kind === 'zip' || kind === 'file') { downloadUrl(url, a.name); return; }
    openModal({
      title: a.name,
      subtitle: [`${kind === 'pdf' ? 'PDF' : 'Image'} · ${formatSize(a.size)}`, timestampsLong(a.createdAt, a.updatedAt)].filter(Boolean).join(' · '),
      wide: true,
      html: kind === 'image'
        ? `<div class="attachment-preview"><img class="attachment-preview__img" src="${url}" alt="${esc(a.name)}"></div>`
        : `<div class="attachment-preview"><iframe class="attachment-preview__frame" src="${url}" title="${esc(a.name)}"></iframe></div>`,
      cancelLabel: 'Close',
      altLabel: 'Open in new tab',
      submitLabel: 'Download',
      onSubmit: () => downloadUrl(url, a.name),
      onAlt: () => { if (!window.open(url, '_blank')) downloadUrl(url, a.name); }
    });
  }

  // Delete stored files that no saved checklist references any more.
  // Files created in the last minute are kept (they may be about to be referenced).
  function referencedFileIds() {
    const ids = new Set(allAttachments(checklist).map((a) => a.id));
    savedIds().forEach((id) => {
      const c = readChecklist(id);
      if (c) allAttachments(c).forEach((a) => ids.add(a.id));
    });
    return ids;
  }
  async function gcFiles() {
    try {
      const records = await fileStore.getAll();
      const refs = referencedFileIds();
      const cutoff = Date.now() - 60000;
      const dead = records.filter((r) => !refs.has(r.id) && (r.created || 0) < cutoff).map((r) => r.id);
      if (!dead.length) return;
      await fileStore.removeMany(dead);
      dead.forEach(revokeFileUrl);
    } catch (e) { /* storage unavailable: nothing to clean */ }
  }
  let gcTimer;
  function scheduleGc(delay = 1500) { clearTimeout(gcTimer); gcTimer = setTimeout(gcFiles, delay); }

  // Export / import helpers: files travel as base64 inside the JSON
  const blobToBase64 = (blob) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).replace(/^data:[^,]*,/, ''));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
  function base64ToBlob(b64, type) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type });
  }
  async function filesForExport(c) {
    const ids = Array.from(new Set(allAttachments(c).map((a) => a.id)));
    const files = [];
    let missing = 0;
    for (const id of ids) {
      const rec = await fileStore.get(id).catch(() => null);
      if (!rec || !rec.blob) { missing++; continue; }
      files.push({ id, name: rec.name, type: rec.type, size: rec.size, data: await blobToBase64(rec.blob) });
    }
    return { files, missing };
  }
  // Store the files embedded in imported checklists; returns how many could not be stored
  async function storeImportedFiles(list) {
    const records = [];
    let failed = 0;
    list.forEach((c) => (c.importFiles || []).forEach((f) => {
      try {
        const name = str(f.name) || 'file';
        const type = str(f.type) || guessType(name);
        const blob = base64ToBlob(f.data.replace(/^data:[^,]*,/, ""), type);
        records.push({ id: f.id, blob, name, type, size: blob.size, created: Date.now() });
      } catch (e) { failed++; }
    }));
    if (!records.length) return failed;
    try { await fileStore.putMany(records); records.forEach((r) => revokeFileUrl(r.id)); requestPersistentStorage(); }
    catch (e) { failed += records.length; }
    return failed;
  }

  // Drag & drop files onto an item to attach them
  const dragHasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  stagesEl.addEventListener('dragover', (e) => {
    const itemEl = e.target.closest('.item');
    if (!itemEl || !dragHasFiles(e) || !prefs.showAttachments) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    stagesEl.querySelectorAll('.item--dragover').forEach((el) => { if (el !== itemEl) el.classList.remove('item--dragover'); });
    itemEl.classList.add('item--dragover');
  });
  stagesEl.addEventListener('dragleave', (e) => {
    const itemEl = e.target.closest('.item');
    if (itemEl && !itemEl.contains(e.relatedTarget)) itemEl.classList.remove('item--dragover');
  });
  stagesEl.addEventListener('drop', (e) => {
    const itemEl = e.target.closest('.item');
    if (!itemEl || !dragHasFiles(e) || !prefs.showAttachments) return;
    e.preventDefault();
    itemEl.classList.remove('item--dragover');
    const stageEl = itemEl.closest('[data-stage]');
    addAttachments(stageEl.dataset.stage, itemEl.dataset.item, Array.from(e.dataTransfer.files));
  });
  // Dropping a file elsewhere must not navigate away from the app
  window.addEventListener('dragover', (e) => { if (dragHasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', (e) => { if (dragHasFiles(e)) e.preventDefault(); });

  $('#attachInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);

  const columnsField = (value) => ({

  function moveStage(stage, dir) {
    const i = checklist.stages.indexOf(stage);
    const j = i + dir;
    if (j < 0 || j >= checklist.stages.length) return;
    [checklist.stages[i], checklist.stages[j]] = [checklist.stages[j], checklist.stages[i]];

  /* ==================================================================
     Export
     - 1 checklist  → { app, version, type: "checklist", id, title, …, stages }
     - N checklists → { app, version, type: "checklists", exportedAt, checklists: [ … ] }
     ================================================================== */
  const slugify = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  function downloadJSON(data, filename) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  const exportable = (c) => ({ id: c.id, title: c.title, description: c.description, updatedAt: c.updatedAt, stages: c.stages });

  // includeFiles → each exported checklist gets `files: [{ id, name, type, size, data (base64) }]`
  async function exportChecklists(list, includeFiles) {
    const out = list.map(exportable);
    let missing = 0;
    if (includeFiles && list.some((c) => allAttachments(c).length)) {
      toast('Preparing export with attachments…');
      try {
        for (let k = 0; k < list.length; k++) {
          const r = await filesForExport(list[k]);
          missing += r.missing;
          if (r.files.length) out[k].files = r.files;
        }
      } catch (e) { toast('Could not read attachments for the export.', true); return; }
    }
    const note = missing ? ` (${plural(missing, 'attachment')} not found in this browser)` : '';
    if (list.length === 1) {
      const c = list[0];
      downloadJSON({ app: 'checklist-app', version: 1, type: 'checklist', ...out[0] }, `${slugify(c.title) || 'checklist'}-${c.id}.json`);
      toast(`Exported “${c.title || 'Untitled checklist'}”${note}`, missing > 0);
      return;
    }
    const now = new Date().toISOString();
    downloadJSON(
      { app: 'checklist-app', version: 1, type: 'checklists', exportedAt: now, checklists: out },
      `checklists-${list.length}-${now.slice(0, 10)}.json`
    );
    toast(`Exported ${list.length} checklists${note}`, missing > 0);
  }

  function openExportModal() {
    save(); // include the latest edits of the open checklist
    const all = listChecklists();
    const rows = all.map((c) => {
      const s = checklistStats(c);
      const current = c.id === checklist.id;
      return `
        <li>
          <label class="pick-list__row">
            <input type="checkbox" class="pick-list__check" name="checklist" value="${esc(c.id)}" ${current ? 'checked' : ''}>
            <span class="pick-list__text">
              <span class="pick-list__title">${esc(c.title || 'Untitled checklist')}${current ? '<span class="pick-list__badge">Current</span>' : ''}</span>
              <span class="pick-list__meta"><code class="pick-list__id">${esc(c.id)}</code> · ${plural(s.stages, 'stage')} · ${s.done}/${s.items} done</span>
            </span>
          </label>
        </li>`;
    }).join('');

    openModal({
      title: 'Export checklists',
      subtitle: 'Select the checklists to include in the JSON file',
      submitLabel: 'Export',
      html: `
        <div class="pick-list" id="exportList">
          <div class="pick-list__bar">
            <span class="pick-list__count" id="exportCount"></span>
            <button type="button" class="button button--ghost pick-list__toggle" id="exportToggleAll"></button>
          </div>
          <ul class="pick-list__items">${rows}</ul>
        </div>
        ${fieldHTML({ name: 'includeFiles', type: 'checkbox', label: 'Include attachments', hint: 'Embed attached images, PDFs and ZIPs in the JSON (makes the file larger)', value: true })}`,
      onSubmit: (values, formData) => {
        const ids = formData.getAll('checklist');
        const selected = all.filter((c) => ids.includes(c.id));
        if (selected.length) exportChecklists(selected, formData.has('includeFiles'));
      }
    });

    // Select all / none + live count (elements are recreated on every open)
    const list = $('#exportList');
    const boxes = Array.from(list.querySelectorAll('.pick-list__check'));
    const toggleAll = $('#exportToggleAll');
    const sync = () => {
      const n = boxes.filter((b) => b.checked).length;
      boxes.forEach((b) => b.closest('.pick-list__row').classList.toggle('pick-list__row--checked', b.checked));
      $('#exportCount').textContent = `${n} of ${boxes.length} selected`;
      toggleAll.textContent = n === boxes.length ? 'Select none' : 'Select all';
      modalSubmit.disabled = n === 0;
    };
    toggleAll.addEventListener('click', () => {
      const selectAll = boxes.some((b) => !b.checked);
      boxes.forEach((b) => { b.checked = selectAll; });
      sync();
    });
    list.addEventListener('change', sync);
    sync();
  }

  /* ==================================================================
     Import
     For every checklist in the file:
       - id not saved yet → add it
       - id already saved → ask for confirmation to override (Override / Skip / Override all)
     ================================================================== */
  function parseImportFile(parsed) {
    let raws;
    if (Array.isArray(parsed)) raws = parsed;
    else if (parsed && parsed.type === 'checklists' && Array.isArray(parsed.checklists)) raws = parsed.checklists;
    else if (parsed && Array.isArray(parsed.documents)) raws = parsed.documents; // earlier multi-export format
    else raws = [parsed];
    if (!raws.length) throw new Error('Invalid file: no checklists found.');

    const list = raws.map((raw) => {
      const c = normalizeChecklist(raw);
      // embedded attachment files (not saved with the checklist; stored in IndexedDB on import)
      c.importFiles = Array.isArray(raw.files)
        ? raw.files.filter((f) => f && isFileId(f.id) && typeof f.data === 'string')
        : [];
      return c;
    });
    // ids must also be unique within the file itself
    const seen = new Set();
    list.forEach((c) => {
      if (seen.has(c.id)) c.id = newChecklistId(Array.from(seen));
      seen.add(c.id);
    });
    return list;
  }

  function importChecklists(list, filesFailed = 0) {
    save();
    const added = [];
    const overridden = [];
    const skipped = [];
    const failed = [];
    const conflicts = [];

    list.forEach((c) => {
      if (readChecklist(c.id)) conflicts.push(c);
      else if (writeChecklist(c)) added.push(c);
      else failed.push(c);
    });

    const override = (c) => { (writeChecklist(c) ? overridden : failed).push(c); };

    const finish = () => {
      const touched = added.concat(overridden);
      if (touched.length) {
        // Re-open the current checklist if it was overridden, otherwise the first imported one
        const target = touched.find((c) => c.id === checklist.id) || touched[0];
        openChecklist(readChecklist(target.id) || target);
      } else {
        render();
      }
      const parts = [];
      if (added.length) parts.push(`${added.length} added`);
      if (overridden.length) parts.push(`${overridden.length} overridden`);
      if (skipped.length) parts.push(`${skipped.length} skipped`);
      if (failed.length) parts.push(`${failed.length} failed`);
      if (filesFailed) parts.push(`${plural(filesFailed, 'attachment')} could not be stored`);
      toast(`Import: ${parts.join(' · ') || 'nothing imported'}`, failed.length > 0 || filesFailed > 0);
      scheduleGc(65000); // drop files of skipped / overridden checklists once they're no longer recent
    };

    const ask = (index) => {
      if (index >= conflicts.length) { finish(); return; }
      const incoming = conflicts[index];
      const existing = readChecklist(incoming.id);
      const remaining = conflicts.length - index;
      openModal({
        title: 'Override checklist?',
        subtitle: conflicts.length > 1 ? `Conflict ${index + 1} of ${conflicts.length}` : '',
        messageHTML:
          `A checklist with ID <strong>${esc(incoming.id)}</strong> already exists: ` +
          `<strong>${esc(existing ? existing.title || 'Untitled checklist' : incoming.id)}</strong>` +
          (existing && existing.updatedAt ? ` (updated ${esc(formatDate(existing.updatedAt))})` : '') +
          `.<br><br>Override it with the imported <strong>${esc(incoming.title || 'Untitled checklist')}</strong> ` +
          `(${plural(incoming.stages.length, 'stage')})? This cannot be undone.`,
        submitLabel: 'Override', danger: true,
        cancelLabel: 'Skip',
        altLabel: remaining > 1 ? `Override all ${remaining}` : '',
        onSubmit: () => { override(incoming); ask(index + 1); },
        onAlt: () => { conflicts.slice(index).forEach(override); finish(); },
        onCancel: () => { skipped.push(incoming); ask(index + 1); }
      });
    };

    ask(0);
  }

  $('#importInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let list;
      try { list = parseImportFile(JSON.parse(reader.result)); }
      catch (err) { toast(err.message.startsWith('Invalid') ? err.message : 'Could not parse JSON file.', true); return; }
      storeImportedFiles(list).then((filesFailed) => importChecklists(list, filesFailed));
    };
    reader.onerror = () => toast('Could not read file.', true);
    reader.readAsText(file);
  });

  /* ==================================================================
     Events
     ================================================================== */
  document.addEventListener('click', (e) => {
    // Close the switcher when clicking anywhere outside it
    if (!switcherPanel.hidden && !switcherEl.contains(e.target)) closeSwitcher();

    const el = e.target.closest('[data-action]');
    if (!el || el.tagName === 'SELECT' || !document.getElementById('page').contains(el)) return;
    const action = actions[el.dataset.action];
    if (!action) return;
    const stageEl = el.closest('[data-stage]');
    const itemEl = el.closest('[data-item]');
    const stage = stageEl ? findStage(stageEl.dataset.stage) : null;
    const item = itemEl ? findItem(stage, itemEl.dataset.item) : null;
    if (el.type === 'checkbox') e.preventDefault(); // state is re-rendered from data
    action({ stage, item, el });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !switcherPanel.hidden) { closeSwitcher(); switcherToggle.focus(); }
  });

  // Navigating to #<id> (bookmark or manual edit) opens that checklist
  window.addEventListener('hashchange', () => {
    const id = hashId();
    if (!id || id === checklist.id) return;
    const c = isValidId(id) && readChecklist(id);
    if (c) { save(); openChecklist(c); }
    else { toast('No saved checklist with that ID.', true); setActive(checklist.id); }
  });

  // Keep in sync when checklists change in another tab
  window.addEventListener('storage', (e) => {
    if (e.key === PREFS_KEY && e.newValue) {
      try { Object.assign(prefs, JSON.parse(e.newValue)); applyPrefs(); } catch (err) { /* ignore */ }
      return;
    }
    if (!e.key || !e.key.startsWith(CHECKLIST_PREFIX)) return;
    if (e.key === CHECKLIST_PREFIX + checklist.id && e.newValue) {
      const c = readChecklist(checklist.id);
      if (c) { checklist = c; render(); }
    } else {
      $('#switcherCount').textContent = savedIds().length;
      if (!switcherPanel.hidden) renderSwitcher();
    }
  });

  // Inline-editable checklist title & description (autosaved on every keystroke)
  function bindEditable(el, key) {
    el.addEventListener('input', () => {
      checklist[key] = el.innerText.replace(/\n+$/, '');
      save();
      if (key === 'title') document.title = checklist.title || 'Checklists';
    });
    el.addEventListener('blur', () => { if (!el.innerText.trim()) el.textContent = ''; });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (key === 'title' || !e.shiftKey)) { e.preventDefault(); el.blur(); }
      if (e.key === 'Escape') el.blur();
    });
    el.addEventListener('paste', (e) => { // paste as plain text
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, key === 'title' ? text.replace(/\s*\n\s*/g, ' ') : text);
    });
  }
  bindEditable(titleEl, 'title');
  bindEditable(descEl, 'description');

  // Extra safety: flush the open checklist when the tab is hidden or closed
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  /* ==================================================================
     Toast
     ================================================================== */
  let toastTimer;
  function toast(msg, isError = false) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast toast--visible' + (isError ? ' toast--error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast' + (isError ? ' toast--error' : ''); }, 3000);
  }

  render();
  scheduleGc(5000); // clean up files left behind by deleted items/checklists
})();
</script>
</body>
</html>
