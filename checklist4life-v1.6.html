  const hashId = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; } };

  function initialChecklist() {
    migrateLegacy();
    migrateSaved();
    const fromHash = isValidId(hashId()) && readChecklist(hashId());
    if (fromHash) return fromHash;
    const active = store.get(ACTIVE_KEY);
    const fromActive = active && readChecklist(active);
    if (fromActive) return fromActive;
    const saved = listChecklists();
    if (saved.length) return saved[0];
    const c = sampleChecklist();
    writeChecklist(c);
    return c;
  }

  function setActive(id) {
    store.set(ACTIVE_KEY, id);
    if (hashId() === id) return;
    try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; }
  }

  /* ---- Display preferences ---- */
  // Themes: palette (data-theme="dark" for black ones) + optional "simple" style (data-style="simple")
  const THEMES = [
    { id: 'white', label: 'theme_white' },
    { id: 'white-simple', label: 'theme_white_simple' },
    { id: 'black', label: 'theme_black' },
    { id: 'black-simple', label: 'theme_black_simple' }
  ];
  // Best UI language for this browser: the first of its preferred languages we support (e.g. es-MX → es)
  function detectLanguage() {
    const wanted = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
    for (const tag of wanted) {
      const base = String(tag).toLowerCase().split(/[-_]/)[0];
      if (isLang(base)) return base;
    }
    return DEFAULT_LANG;
  }
  function loadPrefs() {
    // first run (nothing saved yet): start in the browser's language
    const defaults = { showDescriptions: true, showNotes: true, showAttachments: true, theme: 'white-simple', lang: store.get(PREFS_KEY) ? DEFAULT_LANG : detectLanguage(), tourDone: false };
    let prefs;
    try { prefs = Object.assign(defaults, JSON.parse(store.get(PREFS_KEY) || '{}')); }
    catch (e) { prefs = defaults; }
    // earlier versions stored 'light' / 'dark' and border toggles
    if (prefs.theme === 'light') prefs.theme = 'white';
    if (prefs.theme === 'dark') prefs.theme = 'black';
    if (!THEMES.some((t) => t.id === prefs.theme)) prefs.theme = 'white-simple';
    if (!isLang(prefs.lang)) prefs.lang = DEFAULT_LANG;
    delete prefs.hideStageBorders;
    delete prefs.hideItemBorders;
    delete prefs.fullWidth;      // removed option: the layout is always full width
    return prefs;
  }

  const prefs = loadPrefs();
  lang = prefs.lang;                    // UI language (before any default titles are created)
  let checklist = initialChecklist();   // the open checklist
  setActive(checklist.id);
  savePrefs(); // persist defaults + migrations so every option is always present in storage

  function save() { writeChecklist(checklist); }
  let prefsWarned = false;
  function savePrefs() {
    const ok = store.set(PREFS_KEY, JSON.stringify(prefs));
    if (!ok && !prefsWarned && typeof toast === "function") { prefsWarned = true; setTimeout(() => toast(t('settings_save_failed'), true)); }
    return ok;
  }

  const findStage = (id) => checklist.stages.find((s) => s.id === id);
  const findItem = (stage, id) => (stage ? stage.items.find((i) => i.id === id) : null);

  /* ==================================================================
     DOM helpers
     ================================================================== */
  const $ = (sel, root = document) => root.querySelector(sel);
  const app = $('#app');
  const stagesEl = $('#stages');
  const titleEl = $('#checklistTitle');
  const descEl = $('#checklistDescription');

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const formatDate = (iso) => {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  };
  // dd/mm/yyyy (e.g. 30/12/2026), local time
  const pad2 = (n) => String(n).padStart(2, '0');
  const formatDMY = (iso) => {
    const d = new Date(iso);
    return isNaN(d) ? '' : `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
  };
  const formatDMYTime = (iso) => {
    const d = new Date(iso);
    return isNaN(d) ? '' : `${formatDMY(iso)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  };
  // Lists show only "Updated at 30/12/2026 14:05"; the created date appears when the note / file is opened
  const timestampsLong = (createdAt, updatedAt) =>
    [updatedAt && t('updated_at', { date: formatDMYTime(updatedAt) }), createdAt && t('created_at', { date: formatDMYTime(createdAt) })].filter(Boolean).join('; ');
  function timestampsHTML(createdAt, updatedAt) {
    const date = updatedAt || createdAt;
    return date ? `<span class="timestamps">${esc(t('updated_at', { date: formatDMYTime(date) }))}</span>` : '';
  }
  const checklistStats = (c) => {
    const items = c.stages.flatMap((s) => s.items);
    return { stages: c.stages.length, items: items.length, done: items.filter((i) => i.done).length };
  };

  const icons = {
    plus: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    edit: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
    note: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',
    up: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>',
    down: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    left: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
    right: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
    coins: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>',
    clock: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    clip: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>',
    close: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    link: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
    print: '<svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>'
  };

  function progressHTML(done, total) {
    const pct = total ? Math.round((done / total) * 100) : 0;
    return `<div class="progress__track"><div class="progress__bar" style="width:${pct}%"></div></div>
            <span class="progress__label">${done}/${total} · ${pct}%</span>`;
  }

  /* ==================================================================
     Rendering
     ================================================================== */
  function renderHeader() {
    if (document.activeElement !== titleEl) titleEl.textContent = checklist.title;
    if (document.activeElement !== descEl) descEl.textContent = checklist.description;
    document.title = checklist.title || t('app_title');
    $('#checklistId').textContent = checklist.id;
    // always shown; greyed out with an explanation until there is time or a cost to report
    const reportBtn = $('#reportButton');
    const noData = !allLogs(checklist).length;
    reportBtn.setAttribute('aria-disabled', String(noData));
    if (noData) reportBtn.title = t('report_empty'); else reportBtn.removeAttribute('title');
    setSwitcherCount(savedIds().length);
  }

  // Right-hand panel: checklist progress + one bar per stage (click a stage to scroll to it)
  function renderProgressPanel() {
    const { items, done } = checklistStats(checklist);
    const allItems = checklist.stages.flatMap((s) => s.items);
    // time spent + costs, right-aligned next to the label
    const timeHTML = (list) => {
      const parts = [];
      const min = sumMinutes(list);
      const costs = sumCosts(list);
      if (min) parts.push(`<span title="${esc(t('time_spent'))}">${formatDuration(min)}</span>`);
      if (costs.length) parts.push(`<span title="${esc(t('costs'))}">${esc(formatCostTotals(costs))}</span>`);
      return parts.length ? `<span class="progress-panel__time">${parts.join(' · ')}</span>` : '';
    };
    $('#progressPanel').innerHTML = `
      <h2 class="progress-panel__heading">${esc(t('progress'))}</h2>
      <div class="progress-panel__total">
        <span class="progress-panel__row">
          <span class="progress-panel__label">${esc(checklist.title || t('untitled_checklist'))}</span>
          ${timeHTML(allItems)}
        </span>
        <div class="progress progress--large">${progressHTML(done, items)}</div>
      </div>
      ${checklist.stages.length ? `
        <ul class="progress-panel__stages">
          ${checklist.stages.map((stage) => {
            const stageDone = stage.items.filter((i) => i.done).length;
            return `
              <li data-target="${esc(stage.id)}">
                <button type="button" class="progress-panel__stage" data-action="scroll-to-stage" data-target="${esc(stage.id)}" title="${esc(t('go_to', { name: stage.title }))}">
                  <span class="progress-panel__row">
                    <span class="progress-panel__label">${esc(stage.title)}</span>
                    ${timeHTML(stage.items)}
                  </span>
                  <span class="progress">${progressHTML(stageDone, stage.items.length)}</span>
                </button>
              </li>`;
          }).join('')}
        </ul>` : `<p class="progress-panel__empty">${esc(t('no_stages_panel'))}</p>`}`;
  }

  /* Place each stage's progress row level with that stage's title (wide layout only).
     Rows never overlap: a row that would collide is pushed below the previous one. */
  const progressPanelEl = $('#progressPanel');
  const narrowLayout = window.matchMedia('(max-width: 960px)');
  function alignProgressPanel() {
    const list = progressPanelEl.querySelector('.progress-panel__stages');
    const aligned = Boolean(list) && !narrowLayout.matches;
    progressPanelEl.classList.toggle('progress-panel--aligned', aligned);
    if (!list) return;
    const rows = Array.from(list.children);
    if (!aligned) {
      list.style.height = '';
      rows.forEach((li) => { li.style.top = ''; });
      return;
    }
    const listTop = list.getBoundingClientRect().top;
    let minTop = 0;
    rows.forEach((li) => {
      const stageEl = stagesEl.querySelector(`[data-stage="${CSS.escape(li.dataset.target)}"]`);
      const titleEl = stageEl && stageEl.querySelector('.stage__title');
      let top = minTop;
      if (titleEl) {
        const r = titleEl.getBoundingClientRect();
        // centre the row's label line (button padding 6px + ~9px half line) on the title's first line
        const firstLine = Math.min(r.height, parseFloat(getComputedStyle(titleEl).lineHeight) || r.height);
        top = Math.max(minTop, r.top - listTop + firstLine / 2 - 15);
      }
      li.style.top = `${Math.round(top)}px`;
      minTop = top + li.offsetHeight + 4;
    });
    list.style.height = `${Math.round(minTop)}px`;
  }
  let alignFrame = 0;
  const scheduleAlign = () => { cancelAnimationFrame(alignFrame); alignFrame = requestAnimationFrame(alignProgressPanel); };
  window.addEventListener('resize', scheduleAlign);
  if (narrowLayout.addEventListener) narrowLayout.addEventListener('change', scheduleAlign);
  // re-align whenever the checklist area changes size (images loading, settings toggled, editing the header…)
  if (window.ResizeObserver) new ResizeObserver(scheduleAlign).observe($('#app'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleAlign);

  function renderItem(item, index, items) {
    const notesLabel = esc(t(item.notes ? 'edit_notes' : 'add_notes'));
    const L = (key) => esc(t(key));
    return `
      <article class="item ${item.done ? 'item--done' : ''}" data-item="${esc(item.id)}">
        <div class="item__top">
          <input type="checkbox" class="item__check" data-action="toggle-item" ${item.done ? 'checked' : ''} aria-label="${esc(t('mark_done', { name: item.title }))}">
          <h3 class="item__title" data-action="toggle-item" title="${esc(item.title)}">${esc(item.title)}</h3>

          <div class="item__actions">
            <button type="button" class="button button--icon item__action item__action--secondary" data-action="move-item-left" aria-label="${L('move_item_back')}" title="${L('move_item_back')}" ${index === 0 ? 'disabled' : ''}>${icons.left}</button>
            <button type="button" class="button button--icon item__action item__action--secondary" data-action="move-item-right" aria-label="${L('move_item_forward')}" title="${L('move_item_forward')}" ${index === items.length - 1 ? 'disabled' : ''}>${icons.right}</button>
            <button type="button" class="button button--icon item__action item__notes ${item.notes ? 'item__notes--filled' : ''}" data-action="edit-notes" aria-label="${notesLabel}" title="${notesLabel}">${icons.note}</button>
            <button type="button" class="button button--icon item__action" data-action="log-time" aria-label="${L('log_time')}" title="${L('log_time')}">${icons.clock}</button>
            <button type="button" class="button button--icon item__action" data-action="log-cost" aria-label="${L('add_cost')}" title="${L('add_cost')}">${icons.coins}</button>
            <button type="button" class="button button--icon item__action item__attach" data-action="attach-file" aria-label="${L('attach_file')}" title="${L('attach_file_title')}">${icons.clip}</button>
            <button type="button" class="button button--icon item__action item__action--secondary" data-action="edit-item" aria-label="${L('edit_item')}" title="${L('edit_item')}">${icons.edit}</button>
            <button type="button" class="button button--icon button--icon-danger item__action item__action--secondary" data-action="delete-item" aria-label="${L('delete_item')}" title="${L('delete_item')}">${icons.trash}</button>
          </div>
        </div>
        ${item.timeLogs.length || item.costs.length ? `
          <div class="item__meta">
            ${item.timeLogs.length ? `<button type="button" class="item__time" data-action="log-time" title="${L('time_spent_more')}">${icons.clock}${formatDuration(sumMinutes([item]))}</button>` : ''}
            ${item.costs.length ? `<button type="button" class="item__cost" data-action="log-cost" title="${L('costs_more')}">${icons.coins}${esc(formatCostTotals(sumCosts([item])))}</button>` : ''}
          </div>` : ''}
        ${item.description ? `<p class="item__description">${esc(item.description)}</p>` : ''}
        ${item.notes ? `
          <div class="item__notes-preview" data-action="edit-notes" title="${esc(item.notes)}">
            <span class="item__notes-text">${esc(notesPreview(item.notes))}</span>
            ${timestampsHTML(item.notesCreatedAt, item.notesUpdatedAt)}
          </div>` : ''}
        ${item.attachments.length ? `<ul class="item__attachments">${item.attachments.map(renderAttachment).join('')}</ul>` : ''}
      </article>`;
  }

  // First non-empty line of a note, with … when there is more below it
  function notesPreview(notes) {
    const lines = notes.split(/\r?\n/);
    const first = lines.findIndex((l) => l.trim());
    if (first < 0) return '';
    const more = lines.slice(first + 1).some((l) => l.trim());
    return lines[first].trim() + (more ? ' …' : '');
  }

  function renderAttachment(a) {
    const kind = fileKind(a);
    const label = t({ image: 'preview', pdf: 'open', zip: 'download' }[kind] || 'open');
    const visual = kind === 'image'
      ? `<span class="attachment__thumb"><img data-thumb="${esc(a.id)}" alt=""></span>`
      : `<span class="attachment__badge attachment__badge--${kind}" aria-hidden="true">${kind === 'file' ? 'FILE' : kind.toUpperCase()}</span>`;
    return `
      <li class="attachment attachment--${kind}" data-attachment="${esc(a.id)}">
        <button type="button" class="attachment__open" data-action="open-attachment" title="${esc(label)} ${esc(a.name)}">
          ${visual}
          <span class="attachment__info">
            <span class="attachment__line">
              <span class="attachment__name">${esc(a.name)}</span>
              <span class="attachment__size">${formatSize(a.size)}</span>
            </span>
            ${timestampsHTML(a.createdAt, a.updatedAt)}
          </span>
        </button>
        <button type="button" class="button button--icon button--icon-danger attachment__remove" data-action="remove-attachment" aria-label="${esc(t('remove_name', { name: a.name }))}" title="${esc(t('remove_attachment'))}">${icons.close}</button>
      </li>`;
  }

  function renderStage(stage, index) {
    const L = (key) => esc(t(key));
    return `
      <section class="stage" data-stage="${esc(stage.id)}">
        <div class="stage__header">
          <div class="stage__heading">
            <h2 class="stage__title">${esc(stage.title)}</h2>
            ${stage.description ? `<p class="stage__description">${esc(stage.description)}</p>` : ''}
          </div>
          <div class="stage__actions">
            <button type="button" class="button button--icon" data-action="move-stage-up" aria-label="${L('move_stage_up')}" title="${L('move_stage_up')}" ${index === 0 ? 'disabled' : ''}>${icons.up}</button>
            <button type="button" class="button button--icon" data-action="move-stage-down" aria-label="${L('move_stage_down')}" title="${L('move_stage_down')}" ${index === checklist.stages.length - 1 ? 'disabled' : ''}>${icons.down}</button>
            <button type="button" class="button button--icon" data-action="edit-stage" aria-label="${L('edit_stage')}" title="${L('edit_stage')}">${icons.edit}</button>
            <button type="button" class="button button--icon button--icon-danger" data-action="delete-stage" aria-label="${L('delete_stage')}" title="${L('delete_stage')}">${icons.trash}</button>
            <button type="button" class="button button--icon" data-action="add-item" aria-label="${L('add_item')}" title="${L('add_item')}">${icons.plus}</button>
          </div>
        </div>
        <div class="stage__grid ${stage.columns >= 5 ? 'stage__grid--dense' : ''}" style="--columns:${stage.columns}">
          ${stage.items.length ? stage.items.map(renderItem).join('') : `<div class="stage__empty">${L('no_items')}</div>`}
        </div>
      </section>`;
  }

  function render() {
    renderHeader();
    renderProgressPanel();
    stagesEl.innerHTML = checklist.stages.length
      ? checklist.stages.map(renderStage).join('') +
        `<button type="button" class="add-stage" data-action="add-stage">${icons.plus}${esc(t('add_stage'))}</button>`
      : `<div class="empty-state">
           <h2 class="empty-state__title">${esc(t('no_stages'))}</h2>
           <p class="empty-state__text">${esc(t('no_stages_text'))}</p>
           <button type="button" class="button button--primary" data-action="add-stage">${icons.plus}${esc(t('add_stage'))}</button>
         </div>`;
    applyPrefs();
    hydrateAttachments();
    alignProgressPanel();
  }

  function applyPrefs() {
    app.classList.toggle('app--no-descriptions', !prefs.showDescriptions);
    app.classList.toggle('app--no-notes', !prefs.showNotes);
    app.classList.toggle('app--no-attachments', !prefs.showAttachments);
    applyTheme(prefs.theme);
    renderSettings();
  }

  /* ---- Display settings in the toolbar (applied + autosaved on change) ---- */
  const settingsEl = $('#settings');

  /* ---- Language: static markup ([data-i18n] text, [data-i18n-attr] "attr:key;attr:key") + language menu ---- */
  const langEl = $('#lang');
  const langPanel = $('#langPanel');
  const langToggle = $('#langToggle');
  function applyStaticI18n() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-attr]').forEach((el) => {
      el.dataset.i18nAttr.split(';').forEach((pair) => {
        const [attr, key] = pair.split(':');
        el.setAttribute(attr, t(key));
      });
    });
    const themeSelect = settingsEl.querySelector('[data-pref="theme"]');
    themeSelect.innerHTML = THEMES.map((th) => `<option value="${th.id}">${esc(t(th.label))}</option>`).join('');
    themeSelect.value = prefs.theme;
    renderLangMenu();
    setMenu(isMenuOpen()); // burger label in the current language
    fitToolbar();          // labels changed length
    if (tourOpen()) showTourStep(tourIndex); // tutorial texts in the new language
  }
  function renderLangMenu() {
    const current = LANGUAGES.find((l) => l.id === lang) || LANGUAGES[0];
    $('#langFlag').innerHTML = FLAGS[current.id];
    $('#langCode').textContent = current.id.toUpperCase();
    langToggle.title = `${t('language')}: ${current.name}`;
    langToggle.setAttribute('aria-label', langToggle.title);
    langPanel.setAttribute('aria-label', t('language'));
    langPanel.innerHTML = LANGUAGES.map((l) => `
      <li role="none">
        <button type="button" class="lang__option" role="menuitemradio" aria-checked="${l.id === lang}" data-action="set-lang" data-lang="${l.id}" lang="${l.id}">
          <span class="lang__flag" aria-hidden="true">${FLAGS[l.id]}</span>
          <span>${esc(l.name)}</span>
        </button>
      </li>`).join('');
  }
  /* ---- Mobile menu (burger): the toolbar items, shown in a panel while open ---- */
  const isMenuOpen = () => document.querySelector('.toolbar').classList.contains('toolbar--open');
  function setMenu(open) {
    document.querySelector('.toolbar').classList.toggle('toolbar--open', open);
    document.documentElement.classList.toggle('menu-open', open); // full-screen menu: lock the page behind
    const burger = document.getElementById('toolbarBurger');
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', t(open ? 'menu_close' : 'menu_open'));
    burger.title = burger.getAttribute('aria-label');
  }
  // Compact mode (Switch + burger only) whenever the toolbar items don't fit on one line.
  // Measured with everything forced onto one line; re-run on resize, language change and font load.
  function fitToolbar() {
    const bar = document.querySelector('.toolbar');
    bar.classList.remove('toolbar--compact');
    bar.classList.add('toolbar--measure');
    const fits = bar.scrollWidth <= bar.clientWidth + 1;
    bar.classList.remove('toolbar--measure');
    bar.classList.toggle('toolbar--compact', !fits);
    if (fits && isMenuOpen()) setMenu(false);
  }
  let fitFrame = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(fitFrame); fitFrame = requestAnimationFrame(fitToolbar); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitToolbar);
  // the toolbar can get narrower/wider without a window resize (a page scrollbar appears or disappears)
  if (window.ResizeObserver) {
    let barWidth = 0;
    new ResizeObserver(([entry]) => {
      const width = Math.round(entry.contentRect.width);
      if (width === barWidth) return; // only width matters (compact mode changes the height)
      barWidth = width;
      cancelAnimationFrame(fitFrame);
      fitFrame = requestAnimationFrame(fitToolbar);
    }).observe(document.querySelector('.toolbar'));
  }
  // Switch button count: re-measure when it gains or loses a digit
  function setSwitcherCount(n) {
    const el = document.getElementById('switcherCount');
    if (el.textContent === String(n)) return;
    const digits = el.textContent.length;
    el.textContent = n;
    if (String(n).length !== digits) fitToolbar();
  }
  // Toolbar actions after which the menu closes (settings toggles keep it open)
  const MENU_CLOSING_ACTIONS = new Set(['new-checklist', 'clone-checklist', 'open-checklist', 'delete-checklist', 'delete-all', 'import', 'export', 'set-lang']);

  function openLangMenu() {
    langPanel.hidden = false;
    langToggle.setAttribute('aria-expanded', 'true');
    const active = langPanel.querySelector('[aria-checked="true"]');
    if (active) active.focus();
  }
  function closeLangMenu() {
    langPanel.hidden = true;
    langToggle.setAttribute('aria-expanded', 'false');
  }
  // Re-translate everything after prefs.lang changed (menu choice or another tab)
  function applyLang() {
    lang = prefs.lang;
    applyStaticI18n();
    render();
    if (!switcherPanel.hidden) renderSwitcher();
  }
  function setLang(id) {
    if (!isLang(id) || id === prefs.lang) return;
    prefs.lang = id;
    savePrefs();
    translateDefaultChecklist(id); // only while it is still the original content
    applyLang();
  }
  function renderSettings() {
    settingsEl.querySelectorAll('[data-pref]').forEach((el) => {
      const value = prefs[el.dataset.pref];
      if (el.type === 'checkbox') {
        el.checked = Boolean(value);
        el.closest('.toggle-chip').classList.toggle('toggle-chip--on', Boolean(value));
      } else if (el.value !== value) {
        el.value = value;
      }
    });
  }
  settingsEl.addEventListener('change', (e) => {
    const el = e.target.closest('[data-pref]');
    if (!el) return;
    prefs[el.dataset.pref] = el.type === 'checkbox' ? el.checked : el.value;
    savePrefs();
    applyPrefs();
  });
  // keyboard focus ring on the chip (the checkbox itself is invisible)
  settingsEl.addEventListener('focusin', (e) => {
    const chip = e.target.closest('.toggle-chip');
    if (chip && e.target.matches(':focus-visible')) chip.classList.add('toggle-chip--focus');
  });
  settingsEl.addEventListener('focusout', (e) => {
    const chip = e.target.closest('.toggle-chip');
    if (chip) chip.classList.remove('toggle-chip--focus');
  });

  function applyTheme(theme) {
    const root = document.documentElement;
    if (theme.startsWith('black')) root.dataset.theme = 'dark'; else delete root.dataset.theme;
    if (theme.endsWith('-simple')) root.dataset.style = 'simple'; else delete root.dataset.style;
  }

  function commit() { save(); render(); }

  /* ==================================================================
     Checklist switcher
     ================================================================== */
  const switcherEl = $('#switcher');
  const switcherPanel = $('#switcherPanel');
  const switcherToggle = $('#switcherToggle');

  function renderSwitcher() {
    $('#switcherList').innerHTML = listChecklists().map((c) => {
      const s = checklistStats(c);
      const active = c.id === checklist.id;
      const info = [tn('n_stages', s.stages), t('done_count', { done: s.done, total: s.items }), c.updatedAt ? t('updated_date', { date: formatDate(c.updatedAt) }) : '']
        .filter(Boolean).join(' · ');
      return `
        <li class="switcher__item ${active ? 'switcher__item--active' : ''}">
          <button type="button" class="switcher__select" data-action="open-checklist" data-checklist="${esc(c.id)}" ${active ? 'aria-current="true"' : ''}>
            <span class="switcher__title">${esc(c.title || t('untitled_checklist'))}</span>
            <code class="switcher__id">${esc(c.id)}</code>
            <span class="switcher__info">${esc(info)}</span>
          </button>
          <button type="button" class="button button--icon button--icon-danger switcher__delete" data-action="delete-checklist" data-checklist="${esc(c.id)}" aria-label="${esc(t('delete_checklist_named', { name: c.title }))}" title="${esc(t('delete_checklist'))}">${icons.trash}</button>
        </li>`;
    }).join('');
  }

  function openSwitcher() {
    save(); // list the open checklist with its latest title/progress
    renderSwitcher();
    switcherPanel.hidden = false;
    switcherToggle.setAttribute('aria-expanded', 'true');
  }
  function closeSwitcher() {
    switcherPanel.hidden = true;
    switcherToggle.setAttribute('aria-expanded', 'false');
  }

  function openChecklist(c) {
    checklist = c;
    setActive(c.id);
    closeSwitcher();
    render();
  }

  /* ==================================================================
     Modal
     openModal({ title, subtitle, message (html-escaped), messageHTML, fields, html,
                 submitLabel, danger, cancelLabel, hideCancel, altLabel,
                 onSubmit(values, formData), onAlt(), onCancel(), onChange(name, checked) })
     ================================================================== */
  const modal = $('#modal');
  const modalForm = $('#modalForm');
  const modalBody = $('#modalBody');
  const modalSubmit = $('#modalSubmit');
  const modalCancel = $('#modalCancel');
  const modalAlt = $('#modalAlt');
  let handlers = {};

  function fieldHTML(f) {
    if (f.type === 'checkbox') {
      return `
        <label class="field field--toggle">
          <span class="field__text">
            <span class="field__label">${esc(f.label)}</span>
            ${f.hint ? `<span class="field__hint">${esc(f.hint)}</span>` : ''}
          </span>
          <input type="checkbox" role="switch" class="field__switch" name="${f.name}" ${f.value ? 'checked' : ''}>
        </label>`;
    }
    const control = f.type === 'select'
      ? `<select class="field__select" name="${f.name}">${f.options.map((o) => `<option value="${esc(o.value)}" ${String(o.value) === String(f.value) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`
      : f.type === 'textarea'
      ? `<textarea class="field__textarea ${f.tall ? 'field__textarea--tall' : ''}" name="${f.name}" placeholder="${esc(f.placeholder || '')}">${esc(f.value || '')}</textarea>`
      : `<input class="field__input" name="${f.name}" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}" ${f.required ? 'required' : ''} autocomplete="off">`;
    return `<label class="field"><span class="field__label">${esc(f.label)}</span>${control}</label>`;
  }

  function openModal(o) {
    $('#modalTitle').textContent = o.title;
    const sub = $('#modalSubtitle');
    sub.textContent = o.subtitle || '';
    sub.hidden = !o.subtitle;

    const message = o.messageHTML || (o.message ? esc(o.message) : '');
    const fields = o.fields || [];
    modalBody.innerHTML = (message ? `<p class="modal__message">${message}</p>` : '') + fields.map(fieldHTML).join('') + (o.html || '');
    modalBody.hidden = !message && !fields.length && !o.html;

    modalSubmit.textContent = o.submitLabel || t('save');
    modalSubmit.className = 'button ' + (o.danger ? 'button--danger' : 'button--primary');
    modalSubmit.disabled = false;
    modalCancel.textContent = o.cancelLabel || t('cancel');
    modalCancel.hidden = Boolean(o.hideCancel);
    modalAlt.textContent = o.altLabel || '';
    modalAlt.hidden = !o.altLabel;

    modal.classList.toggle('modal--wide', Boolean(o.wide));
    handlers = { submit: o.onSubmit, alt: o.onAlt, cancel: o.onCancel, change: o.onChange };
    if (!modal.open) modal.showModal();
    const first = modalBody.querySelector('input:not([type="checkbox"]), textarea');
    if (first) { first.focus(); const len = first.value.length; first.setSelectionRange(len, len); }
    else modalSubmit.focus();
  }

  // Close the modal, then run exactly one handler (it may open the next modal)
  function finishModal(kind, ...args) {
    const h = handlers[kind];
    handlers = {};
    modal.close();
    if (h) h(...args);
  }

  modalForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(modalForm);
    finishModal('submit', Object.fromEntries(formData.entries()), formData);
  });
  modalAlt.addEventListener('click', () => finishModal('alt'));
  modal.addEventListener('click', (e) => {
    if (e.target.closest('[data-modal-dismiss]') || e.target === modal) finishModal('cancel');
  });
  modal.addEventListener('cancel', (e) => { // Escape key
    e.preventDefault();
    if (modal.querySelector('[role="combobox"][aria-expanded="true"]')) return; // Escape closes the suggestions list first
    finishModal('cancel');
  });
  modal.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); modalForm.requestSubmit(); }
  });
  modalBody.addEventListener('change', (e) => {
    if (!handlers.change) return;
    if (e.target.type === 'checkbox') handlers.change(e.target.name, e.target.checked);
    else if (e.target.type === 'radio' && e.target.checked) handlers.change(e.target.name, e.target.value);
  });

  /* ==================================================================
     Attachments
     Files are stored as Blobs in IndexedDB (localStorage is text-only and ~5 MB).
     Items only keep { id, name, type, size }. Files no longer referenced by any
     saved checklist are garbage-collected (gcFiles).
     ================================================================== */
  const fileStore = (() => {
    let dbPromise = null;
    function db() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          if (!window.indexedDB) { reject(new Error(t('idb_unavailable'))); return; }
          const req = indexedDB.open('checklist-app', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('files', { keyPath: 'id' });
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        dbPromise.catch(() => { dbPromise = null; });
      }
      return dbPromise;
    }
    // Run `fn(store)` in one transaction; resolves with the last request's result once committed
    const run = (mode, fn) => db().then((d) => new Promise((resolve, reject) => {
      const tx = d.transaction('files', mode);
      let result;
      const req = fn(tx.objectStore('files'));
      if (req) req.onsuccess = () => { result = req.result; };
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Storage transaction aborted.'));
    }));
    return {
      putMany: (records) => run('readwrite', (s) => { records.forEach((r) => s.put(r)); }),
      get: (id) => run('readonly', (s) => s.get(id)),
      getAll: () => run('readonly', (s) => s.getAll()),
      removeMany: (ids) => run('readwrite', (s) => { ids.forEach((id) => s.delete(id)); })
    };
  })();

  const IMAGE_EXT = /\.(png|jpe?g|gif|webp|avif|bmp|svg|ico)$/i;
  function fileKind(f) {
    const type = (f.type || '').toLowerCase();
    const name = f.name || '';
    if (type.startsWith('image/') || IMAGE_EXT.test(name)) return 'image';
    if (type === 'application/pdf' || /\.pdf$/i.test(name)) return 'pdf';
    if (type.includes('zip') || /\.zip$/i.test(name)) return 'zip';
    return 'file';
  }
  const isAllowedFile = (f) => fileKind(f) !== 'file';
  function guessType(name) {
    const ext = (name.match(/\.([a-z0-9]+)$/i) || [])[1];
    const map = { pdf: 'application/pdf', zip: 'application/zip', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
      gif: 'image/gif', webp: 'image/webp', avif: 'image/avif', bmp: 'image/bmp', svg: 'image/svg+xml', ico: 'image/x-icon' };
    return map[(ext || '').toLowerCase()] || 'application/octet-stream';
  }
  function formatSize(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    const units = ['KB', 'MB', 'GB'];
    let n = bytes / 1024, u = 0;
    while (n >= 1024 && u < units.length - 1) { n /= 1024; u++; }
    return `${n < 10 ? n.toFixed(1) : Math.round(n)} ${units[u]}`;
  }
  const newFileId = () => 'f' + randomId() + randomId();
  const allAttachments = (c) => c.stages.flatMap((s) => s.items.flatMap((i) => i.attachments));

  // Object URLs for stored files (created once per session, reused for thumbnails/open)
  const fileUrls = new Map();
  const fileUrlRequests = new Map();
  function getFileUrl(id) {
    if (fileUrls.has(id)) return Promise.resolve(fileUrls.get(id));
    if (!fileUrlRequests.has(id)) {
      fileUrlRequests.set(id, fileStore.get(id)
        .then((rec) => {
          if (!rec || !rec.blob) return null;
          const url = URL.createObjectURL(rec.blob);
          fileUrls.set(id, url);
          return url;
        })
        .catch(() => null)
        .finally(() => fileUrlRequests.delete(id)));
    }
    return fileUrlRequests.get(id);
  }
  function revokeFileUrl(id) {
    const url = fileUrls.get(id);
    if (url) { URL.revokeObjectURL(url); fileUrls.delete(id); }
  }

  // After each render: load thumbnails and flag attachments whose file isn't in this browser
  function hydrateAttachments() {
    stagesEl.querySelectorAll('.attachment[data-attachment]').forEach((el) => {
      const id = el.dataset.attachment;
      getFileUrl(id).then((url) => {
        if (!el.isConnected) return;
        el.classList.toggle('attachment--missing', !url);
        const img = el.querySelector('img[data-thumb]');
        if (img && url && img.getAttribute('src') !== url) img.src = url;
      });
    });
  }

  let persistRequested = false;
  function requestPersistentStorage() {
    if (persistRequested) return;
    persistRequested = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignore */ }
  }

  const storageError = (err) => (err && err.name === 'QuotaExceededError')
    ? t('storage_full')
    : (err && err.message ? t('storage_failed_msg', { msg: err.message }) : t('storage_failed'));

  async function addAttachments(stageId, itemId, files) {
    const allowed = files.filter(isAllowedFile);
    const rejected = files.length - allowed.length;
    if (!allowed.length) { toast(t('only_allowed'), true); return; }
    const records = allowed.map((f) => {
      const name = f.name || 'file';
      return { id: newFileId(), blob: f, name, type: f.type || guessType(name), size: f.size, created: Date.now() };
    });
    try { await fileStore.putMany(records); }
    catch (err) { toast(storageError(err), true); return; }
    requestPersistentStorage();
    const item = findItem(findStage(stageId), itemId); // the checklist may have changed meanwhile
    if (!item) { scheduleGc(); return; }
    const now = new Date().toISOString();
    item.attachments.push(...records.map((r) => normalizeAttachment({ ...r, createdAt: now, updatedAt: now })));
    commit();
    toast(t('attached', { files: tn('n_files', records.length) }) + (rejected ? t('attached_skipped', { n: rejected }) : ''), rejected > 0);
  }

  function downloadUrl(url, filename) {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  async function openAttachment(a) {
    const kind = fileKind(a);
    const url = await getFileUrl(a.id);
    if (!url) {
      toast(t('file_not_stored'), true);
      hydrateAttachments();
      return;
    }
    if (kind === 'zip' || kind === 'file') { downloadUrl(url, a.name); return; }
    openModal({
      title: a.name,
      subtitle: [`${t(kind === 'pdf' ? 'kind_pdf' : 'kind_image')} · ${formatSize(a.size)}`, timestampsLong(a.createdAt, a.updatedAt)].filter(Boolean).join(' · '),
      wide: true,
      html: kind === 'image'
        ? `<div class="attachment-preview"><img class="attachment-preview__img" src="${url}" alt="${esc(a.name)}"></div>`
        : `<div class="attachment-preview"><iframe class="attachment-preview__frame" src="${url}" title="${esc(a.name)}"></iframe></div>`,
      cancelLabel: t('close'),
      altLabel: t('open_new_tab'),
      submitLabel: t('download'),
      onSubmit: () => downloadUrl(url, a.name),
      onAlt: () => { if (!window.open(url, '_blank')) downloadUrl(url, a.name); }
    });
  }

  // Delete stored files that no saved checklist references any more.
  // Files created in the last minute are kept (they may be about to be referenced).
  function referencedFileIds() {
    const ids = new Set(allAttachments(checklist).map((a) => a.id));
    savedIds().forEach((id) => {
      const c = readChecklist(id);
      if (c) allAttachments(c).forEach((a) => ids.add(a.id));
    });
    return ids;
  }
  async function gcFiles() {
    try {
      const records = await fileStore.getAll();
      const refs = referencedFileIds();
      const cutoff = Date.now() - 60000;
      const dead = records.filter((r) => !refs.has(r.id) && (r.created || 0) < cutoff).map((r) => r.id);
      if (!dead.length) return;
      await fileStore.removeMany(dead);
      dead.forEach(revokeFileUrl);
    } catch (e) { /* storage unavailable: nothing to clean */ }
  }
  let gcTimer;
  function scheduleGc(delay = 1500) { clearTimeout(gcTimer); gcTimer = setTimeout(gcFiles, delay); }

  // Export / import helpers: files travel as base64 inside the JSON
  const blobToBase64 = (blob) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).replace(/^data:[^,]*,/, ''));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
  function base64ToBlob(b64, type) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type });
  }
  async function filesForExport(c) {
    const ids = Array.from(new Set(allAttachments(c).map((a) => a.id)));
    const files = [];
    let missing = 0;
    for (const id of ids) {
      const rec = await fileStore.get(id).catch(() => null);
      if (!rec || !rec.blob) { missing++; continue; }
      files.push({ id, name: rec.name, type: rec.type, size: rec.size, data: await blobToBase64(rec.blob) });
    }
    return { files, missing };
  }
  // Store the files embedded in imported checklists; returns how many could not be stored
  async function storeImportedFiles(list) {
    const records = [];
    let failed = 0;
    list.forEach((c) => (c.importFiles || []).forEach((f) => {
      try {
        const name = str(f.name) || 'file';
        const type = str(f.type) || guessType(name);
        const blob = base64ToBlob(f.data.replace(/^data:[^,]*,/, ""), type);
        records.push({ id: f.id, blob, name, type, size: blob.size, created: Date.now() });
      } catch (e) { failed++; }
    }));
    if (!records.length) return failed;
    try { await fileStore.putMany(records); records.forEach((r) => revokeFileUrl(r.id)); requestPersistentStorage(); }
    catch (e) { failed += records.length; }
    return failed;
  }

  // Drag & drop files onto an item to attach them
  const dragHasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  stagesEl.addEventListener('dragover', (e) => {
    const itemEl = e.target.closest('.item');
    if (!itemEl || !dragHasFiles(e) || !prefs.showAttachments) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    stagesEl.querySelectorAll('.item--dragover').forEach((el) => { if (el !== itemEl) el.classList.remove('item--dragover'); });
    itemEl.classList.add('item--dragover');
  });
  stagesEl.addEventListener('dragleave', (e) => {
    const itemEl = e.target.closest('.item');
    if (itemEl && !itemEl.contains(e.relatedTarget)) itemEl.classList.remove('item--dragover');
  });
  stagesEl.addEventListener('drop', (e) => {
    const itemEl = e.target.closest('.item');
    if (!itemEl || !dragHasFiles(e) || !prefs.showAttachments) return;
    e.preventDefault();
    itemEl.classList.remove('item--dragover');
    const stageEl = itemEl.closest('[data-stage]');
    addAttachments(stageEl.dataset.stage, itemEl.dataset.item, Array.from(e.dataTransfer.files));
  });
  // Dropping a file elsewhere must not navigate away from the app
  window.addEventListener('dragover', (e) => { if (dragHasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', (e) => { if (dragHasFiles(e)) e.preventDefault(); });

  let attachTarget = null;
  $('#attachInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (files.length && attachTarget) addAttachments(attachTarget.stageId, attachTarget.itemId, files);
    attachTarget = null;
  });

  /* ==================================================================
     Actions (dispatched from [data-action] clicks)
     ================================================================== */
  const actions = {
    /* ---- Checklists ---- */
    'new-checklist'() {
      save();
      const c = blankChecklist();
      writeChecklist(c);
      openChecklist(c);
      titleEl.focus();
      document.execCommand('selectAll', false, null);
      toast(t('checklist_created', { id: c.id }));
    },
    'clone-checklist'() {
      save();
      // Deep copy with fresh ids; attachments keep pointing at the same stored files
      // (files are shared and only deleted once no checklist references them).
      const copy = normalizeChecklist(JSON.parse(JSON.stringify({
        ...checklist,
        defaultTemplate: '', // a copy is a normal checklist (never translated)
        title: t('copy_title', { title: checklist.title || t('untitled_checklist') }),
        stages: checklist.stages.map((s) => ({ ...s, id: uid(), items: s.items.map((i) => ({ ...i, id: uid() })) }))
      })), newChecklistId());
      if (!writeChecklist(copy)) { toast(t('clone_failed'), true); return; }
      openChecklist(copy);
      toast(t('cloned', { title: copy.title, id: copy.id }));
    },
    'open-checklist'({ el }) {
      const id = el.dataset.checklist;
      if (id === checklist.id) { closeSwitcher(); return; }
      save();
      const c = readChecklist(id);
      if (!c) { toast(t('checklist_gone'), true); renderSwitcher(); return; }
      openChecklist(c);
    },
    'delete-checklist'({ el }) {
      const c = readChecklist(el.dataset.checklist);
      if (!c) { renderSwitcher(); return; }
      closeSwitcher();
      openModal({
        title: t('delete_checklist_q'),
        messageHTML: t('delete_checklist_msg', { title: `<strong>${esc(c.title || t('untitled_checklist'))}</strong>`, id: esc(c.id) }),
        submitLabel: t('delete'), danger: true,
        onSubmit: () => {
          store.remove(CHECKLIST_PREFIX + c.id);
          scheduleGc();
          if (c.id === checklist.id) {
            const next = listChecklists()[0] || blankChecklist();
            if (!next.updatedAt) writeChecklist(next);
            openChecklist(next);
          } else {
            render();
          }
          toast(t('checklist_deleted'));
        }
      });
    },
    'toggle-switcher'() { switcherPanel.hidden ? openSwitcher() : closeSwitcher(); },
    // Remove every saved checklist (their attachment files are garbage-collected) and start over
    // with the default checklist, as on the first run (in the current language, translated on
    // language switches while untouched); display settings and language are kept
    'delete-all'() {
      save();
      const count = savedIds().length;
      closeSwitcher();
      openModal({
        title: t('delete_all_q'),
        message: t('delete_all_msg', { checklists: tn('n_checklists', count) }),
        submitLabel: t('delete_all'), danger: true,
        onSubmit: () => {
          savedIds().forEach((id) => store.remove(CHECKLIST_PREFIX + id));
          const fresh = sampleChecklist(lang);
          writeChecklist(fresh);
          openChecklist(fresh);
          scheduleGc();
          toast(t('all_deleted'));
        }
      });
    },
    'copy-id'() {
      const ok = () => toast(t('id_copied'));
      const fail = () => toast(t('id_is', { id: checklist.id }));
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(checklist.id).then(ok, fail);
        else fail();
      } catch (e) { fail(); }
    },

    /* ---- Stages ---- */
    'add-stage'() {
      openModal({
        title: t('new_stage'), subtitle: checklist.title, submitLabel: t('add_stage'),
        fields: [
          { name: 'title', label: t('title'), required: true, placeholder: t('stage_title_ph') },
          { name: 'description', label: t('description'), type: 'textarea', placeholder: t('stage_desc_ph') },
          columnsField(NEW_STAGE_COLUMNS)
        ],
        onSubmit: (v) => {
          checklist.stages.push(normalizeStage({ title: v.title.trim(), description: v.description.trim(), columns: parseColumns(v.columns) }));
          commit();
        }
      });
    },
    'edit-stage'({ stage }) {
      openModal({
        title: t('edit_stage'),
        fields: [
          { name: 'title', label: t('title'), required: true, value: stage.title },
          { name: 'description', label: t('description'), type: 'textarea', value: stage.description },
          columnsField(stage.columns)
        ],
        onSubmit: (v) => {
          stage.title = v.title.trim();
          stage.description = v.description.trim();
          stage.columns = parseColumns(v.columns);
          commit();
        }
      });
    },
    'delete-stage'({ stage }) {
      openModal({
        title: t('delete_stage_q'),
        messageHTML: t('delete_stage_msg', { title: `<strong>${esc(stage.title)}</strong>`, items: tn('n_items', stage.items.length) }),
        submitLabel: t('delete'), danger: true,
        onSubmit: () => { checklist.stages = checklist.stages.filter((s) => s !== stage); commit(); scheduleGc(); toast(t('stage_deleted')); }
      });
    },
    'move-stage-up'({ stage }) { moveStage(stage, -1); },
    'move-stage-down'({ stage }) { moveStage(stage, 1); },

    /* ---- Items ---- */
    'add-item'({ stage }) {
      openModal({
        title: t('new_item'), subtitle: stage.title, submitLabel: t('add_item'),
        fields: [
          { name: 'title', label: t('title'), required: true, placeholder: t('item_title_ph') },
          { name: 'description', label: t('description'), type: 'textarea', placeholder: t('item_desc_ph') }
        ],
        onSubmit: (v) => {
          stage.items.push(normalizeItem({ title: v.title.trim(), description: v.description.trim() }));
          commit();
        }
      });
    },
    'edit-item'({ stage, item }) {
      openModal({
        title: t('edit_item'), subtitle: stage.title,
        fields: [
          { name: 'title', label: t('title'), required: true, value: item.title },
          { name: 'description', label: t('description'), type: 'textarea', value: item.description }
        ],
        onSubmit: (v) => { item.title = v.title.trim(); item.description = v.description.trim(); commit(); }
      });
    },
    'delete-item'({ stage, item }) {
      openModal({
        title: t('delete_item_q'),
        messageHTML: item.attachments.length
          ? t('delete_item_msg_files', { title: `<strong>${esc(item.title)}</strong>`, attachments: tn('n_attachments', item.attachments.length) })
          : t('delete_item_msg', { title: `<strong>${esc(item.title)}</strong>` }),
        submitLabel: t('delete'), danger: true,
        onSubmit: () => { stage.items = stage.items.filter((i) => i !== item); commit(); scheduleGc(); }
      });
    },
    'log-time'({ stage, item }) { openTimeLog(stage, item); },
    'log-cost'({ item }) { openCosts(item); },
    'attach-file'({ stage, item }) {
      attachTarget = { stageId: stage.id, itemId: item.id };
      $('#attachInput').click();
    },
    'open-attachment'({ item, el }) {
      const a = item.attachments.find((x) => x.id === el.closest('[data-attachment]').dataset.attachment);
      if (a) openAttachment(a);
    },
    'remove-attachment'({ item, el }) {
      const a = item.attachments.find((x) => x.id === el.closest('[data-attachment]').dataset.attachment);
      if (!a) return;
      openModal({
        title: t('remove_attachment_q'),
        messageHTML: t('remove_attachment_msg', { name: `<strong>${esc(a.name)}</strong>`, item: `<strong>${esc(item.title)}</strong>` }),
        submitLabel: t('remove'), danger: true,
        onSubmit: () => { item.attachments = item.attachments.filter((x) => x !== a); commit(); scheduleGc(); }
      });
    },
    'scroll-to-stage'({ el }) {
      const target = stagesEl.querySelector(`[data-stage="${CSS.escape(el.dataset.target)}"]`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    },
    'move-item-left'({ stage, item }) { moveItem(stage, item, -1, 'move-item-left'); },
    'move-item-right'({ stage, item }) { moveItem(stage, item, 1, 'move-item-right'); },
    'toggle-item'({ item }) { item.done = !item.done; commit(); },
    'edit-notes'({ item }) {
      openModal({
        title: t('notes'),
        subtitle: [item.title, timestampsLong(item.notesCreatedAt, item.notesUpdatedAt)].filter(Boolean).join(' · '),
        fields: [{ name: 'notes', label: t('notes'), type: 'textarea', tall: true, value: item.notes, placeholder: t('notes_ph') }],
        onSubmit: (v) => {
          const notes = v.notes.replace(/\s+$/, '');
          if (notes === item.notes) return; // unchanged → keep dates as they are
          const now = new Date().toISOString();
          if (!notes) { item.notesCreatedAt = ''; item.notesUpdatedAt = ''; }
          else { if (!item.notes || !item.notesCreatedAt) item.notesCreatedAt = now; item.notesUpdatedAt = now; }
          item.notes = notes;
          commit();
        }
      });
    },

    /* ---- Import / export ---- */
    'import'() { $('#importInput').click(); },
    'open-report'() { if (allLogs(checklist).length) openReport(); },
    'print-overview'() { openPrintOverview(); },
    'start-tour'() { startTour(); },
    'toggle-menu'() { setMenu(!isMenuOpen()); },
    'toggle-lang'() { langPanel.hidden ? openLangMenu() : closeLangMenu(); },
    'set-lang'({ el }) { closeLangMenu(); langToggle.focus(); setLang(el.dataset.lang); },
    'export'() { openExportModal(); }
  };

  /* "Person" field (last field of the time and cost forms) with a suggestions list of the
     checklist's people: type to filter, ↑/↓ to move, Enter or click to pick, Escape to close.
     Tab or Enter completes the name when exactly one person is suggested (also with nothing typed). */
  function personFieldHTML() {
    return `
      <div class="field person-field">
        <label class="field__label" for="personInput">${esc(t('person'))}</label>
        <input class="field__input" id="personInput" name="person" autocomplete="off" maxlength="80" placeholder="${esc(t('person_ph'))}"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="personOptions">
        <ul class="autocomplete" id="personOptions" role="listbox" hidden></ul>
      </div>`;
  }
  // Wire up the field rendered by personFieldHTML() (call right after the modal opens)
  function bindPersonAutocomplete() {
    const input = $('#personInput');
    const list = $('#personOptions');
    if (!input || !list) return;
    const names = sortedPersons(checklist).map((p) => personName(checklist, p.id));
    let matches = [];
    let active = -1; // highlighted option (-1 = none)
    const isOpen = () => !list.hidden;
    function close() {
      list.hidden = true;
      active = -1;
      input.setAttribute('aria-expanded', 'false');
      input.removeAttribute('aria-activedescendant');
    }
    function update() {
      const typed = personKey(input.value);
      // names containing the typed text, those starting with it first (otherwise alphabetical)
      matches = names.filter((n) => personKey(n).includes(typed))
        .sort((a, b) => personKey(b).startsWith(typed) - personKey(a).startsWith(typed));
      // nothing to suggest, or the name is already complete
      if (!matches.length || (matches.length === 1 && personKey(matches[0]) === typed)) { close(); return; }
      active = Math.min(active, matches.length - 1);
      list.innerHTML = matches.map((n, i) => {
        const at = typed ? n.toLocaleLowerCase().indexOf(typed) : -1;
        const label = at < 0 ? esc(n)
          : esc(n.slice(0, at)) + `<strong class="autocomplete__match">${esc(n.slice(at, at + typed.length))}</strong>` + esc(n.slice(at + typed.length));
        return `<li class="autocomplete__option${i === active ? ' autocomplete__option--active' : ''}" id="personOption${i}" role="option" aria-selected="${i === active}" data-index="${i}">${label}</li>`;
      }).join('');
      list.hidden = false;
      input.setAttribute('aria-expanded', 'true');
      if (active >= 0) {
        input.setAttribute('aria-activedescendant', 'personOption' + active);
        list.children[active].scrollIntoView({ block: 'nearest' });
      } else {
        input.removeAttribute('aria-activedescendant');
      }
    }
    const pick = (i) => { input.value = matches[i]; close(); input.dispatchEvent(new Event('change', { bubbles: true })); };

    input.addEventListener('input', () => { active = -1; update(); });
    input.addEventListener('focus', update);
    input.addEventListener('click', () => { if (!isOpen()) update(); });
    input.addEventListener('blur', close);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!isOpen()) update();
        if (!isOpen()) return;
        e.preventDefault();
        const n = matches.length;
        active = e.key === 'ArrowDown' ? (active + 1) % n : (active <= 0 ? n - 1 : active - 1);
        update();
      } else if ((e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey)) && isOpen()) {
        // the highlighted option, or the only suggestion (also when nothing was typed yet)
        const i = active >= 0 ? active : matches.length === 1 ? 0 : -1;
        if (i < 0) return; // nothing to complete: Enter submits / Tab moves on as usual
        if (e.key === 'Enter') e.preventDefault(); // complete instead of submitting the form
        pick(i); // Tab still moves on to the next field
      } else if (e.key === 'Escape' && isOpen()) {
        e.preventDefault();
        e.stopPropagation();
        setTimeout(close); // closed after the dialog's cancel check, so Escape only closes the list
      }
    });
    list.addEventListener('mousedown', (e) => {
      e.preventDefault(); // keep focus in the input
      const option = e.target.closest('[data-index]');
      if (option) pick(Number(option.dataset.index));
    });
  }

  /* ---- Time log: add entries in minutes, hours, days, weeks, months or years; remove existing ones ----
     A time entry can carry one cost (e.g. hours × hourly rate): it is saved as a normal cost entry
     linked to the time entry (timeLog.costId ↔ cost.timeLogId). */
  // Length of each unit in minutes (calendar time: month = 30 days, year = 365 days)
  const TIME_UNITS = [
    { id: 'minutes', minutes: 1 },
    { id: 'hours', minutes: 60 },
    { id: 'days', minutes: 60 * 24 },
    { id: 'weeks', minutes: 60 * 24 * 7 },
    { id: 'months', minutes: 60 * 24 * 30 },
    { id: 'years', minutes: 60 * 24 * 365 }
  ];
  let lastTimeUnit = 'minutes';
  let lastTimeCostType = 'labor';
  let lastTimeCostMode = 'hour';
  const linkedCost = (item, log) => (log.costId ? item.costs.find((c) => c.id === log.costId) || null : null);
  const linkedLog = (item, cost) => (cost.timeLogId ? item.timeLogs.find((l) => l.id === cost.timeLogId) || null : null);
  const costLabel = (cost) => `${formatMoney(cost.amount, cost.currency)} · ${costTypeLabel(cost.type)}`;
  const linkBadge = (text, title) => `<span class="time-log__link" title="${esc(title)}">${icons.link}${esc(text)}</span>`;
  const amountPattern = '\\s*\\d+([.,]\\d{1,2})?\\s*';

  function timeLogListHTML(item) {
    const entries = item.timeLogs.slice().reverse(); // newest first
    return `
      <div class="time-log__summary"><span>${esc(t('total_time'))}</span><span class="time-log__total">${formatDuration(sumMinutes([item]))}</span></div>
      ${entries.length ? `<ul class="time-log__list">${entries.map((log) => {
        const cost = linkedCost(item, log);
        const who = personName(checklist, log.personId);
        return `
        <li class="time-log__entry" data-entry="${esc(log.id)}">
          <span class="time-log__amount">${formatDuration(log.minutes)}</span>
          ${cost ? linkBadge(formatMoney(cost.amount, cost.currency), t('linked_cost_title', { cost: costLabel(cost) })) : ''}
          <span class="time-log__note" title="${esc(log.note)}">${esc(log.note)}</span>
          <span class="time-log__person" title="${esc(who)}">${esc(who)}</span>
          <span class="time-log__date">${log.loggedAt ? esc(formatDMYTime(log.loggedAt)) : ''}</span>
          <button type="button" class="button button--icon button--icon-danger time-log__remove" data-log="${esc(log.id)}" aria-label="${esc(t('remove_entry'))}" title="${esc(t('remove_entry'))}">${icons.close}</button>
        </li>`;
      }).join('')}</ul>` : `<p class="time-log__empty">${esc(t('nothing_logged'))}</p>`}`;
  }

  // Remove an entry (kind 'time' or 'cost') from its list. When it is linked, the row first asks
  // in place whether to delete the linked entry too or keep it (unlinked).
  function bindEntryRemoval(box, item, kind, listHTML) {
    const entriesOf = (k) => (k === 'time' ? item.timeLogs : item.costs);
    const partnerOf = (entry) => (kind === 'time' ? linkedCost(item, entry) : linkedLog(item, entry));
    box.addEventListener('click', (e) => {
      const choice = e.target.closest('[data-confirm]');
      const removeBtn = e.target.closest('[data-log]');
      if (!choice && !removeBtn) return;
      const row = (choice || removeBtn).closest('[data-entry]');
      const entry = entriesOf(kind).find((x) => x.id === row.dataset.entry);
      const partner = entry && partnerOf(entry);
      if (entry && removeBtn && partner) {
        row.classList.add('time-log__entry--confirm');
        row.innerHTML = `
          <span class="time-log__confirm">${esc(kind === 'time'
            ? t('confirm_linked_cost', { entry: costLabel(partner) })
            : t('confirm_linked_time', { entry: formatDuration(partner.minutes) }))}</span>
          <button type="button" class="button button--danger time-log__choice" data-confirm="both">${esc(t('delete_both'))}</button>
          <button type="button" class="button time-log__choice" data-confirm="one">${esc(t(kind === 'time' ? 'keep_cost' : 'keep_time'))}</button>
          <button type="button" class="button button--ghost time-log__choice" data-confirm="cancel">${esc(t('cancel'))}</button>`;
        row.querySelector('[data-confirm="both"]').focus();
        return;
      }
      if (entry && (!choice || choice.dataset.confirm !== 'cancel')) {
        const other = kind === 'time' ? 'cost' : 'time';
        if (kind === 'time') item.timeLogs = item.timeLogs.filter((x) => x !== entry);
        else item.costs = item.costs.filter((x) => x !== entry);
        if (partner && choice && choice.dataset.confirm === 'both') {
          if (other === 'cost') item.costs = item.costs.filter((x) => x !== partner);
          else item.timeLogs = item.timeLogs.filter((x) => x !== partner);
        } else if (partner) {
          if (other === 'cost') partner.timeLogId = ''; else partner.costId = '';
        }
        commit();
      }
      box.innerHTML = listHTML(item);
    });
  }

  function openTimeLog(stage, item) {
    openModal({
      title: t('log_time'),
      subtitle: item.title,
      submitLabel: t('log_time'),
      cancelLabel: t('close'),
      html: `
        <div class="time-log">
          <div class="time-log__inputs">
            <label class="field">
              <span class="field__label">${esc(t('time_spent'))}</span>
              <input class="field__input" name="amount" inputmode="decimal" autocomplete="off" required
                     pattern="\\s*\\d+([.,]\\d+)?\\s*" placeholder="${esc(t('time_ph'))}" title="${esc(t('time_hint'))}">
            </label>
            <label class="field">
              <span class="field__label">${esc(t('unit'))}</span>
              <select class="field__select" name="unit">
                ${TIME_UNITS.map((u) => `<option value="${u.id}" ${u.id === lastTimeUnit ? 'selected' : ''}>${esc(t(u.id))}</option>`).join('')}
              </select>
            </label>
          </div>
          <label class="field">
            <span class="field__label">${esc(t('note_optional'))}</span>
            <input class="field__input" name="note" autocomplete="off" placeholder="${esc(t('note_ph'))}">
          </label>
          ${personFieldHTML()}
          <fieldset class="time-log__cost">
            <legend class="time-log__cost-title">${esc(t('cost_optional'))}</legend>
            <div class="time-log__inputs time-log__inputs--rate">
              <label class="field">
                <span class="field__label">${esc(t('amount'))}</span>
                <input class="field__input" name="costAmount" inputmode="decimal" autocomplete="off"
                       pattern="${amountPattern}" placeholder="${esc(t('amount_ph'))}" title="${esc(t('amount_hint'))}">
              </label>
              <label class="field">
                <span class="field__label">${esc(t('currency'))}</span>
                <select class="field__select" name="costCurrency">
                  ${CURRENCIES.map((c) => `<option value="${c}" ${c === lastCurrency ? 'selected' : ''}>${c}</option>`).join('')}
                </select>
              </label>
              <label class="field">
                <span class="field__label">${esc(t('price'))}</span>
                <select class="field__select" name="costMode">
                  <option value="hour" ${lastTimeCostMode === 'hour' ? 'selected' : ''}>${esc(t('price_per_hour'))}</option>
                  <option value="total" ${lastTimeCostMode === 'total' ? 'selected' : ''}>${esc(t('price_total'))}</option>
                </select>
              </label>
              <label class="field">
                <span class="field__label">${esc(t('type'))}</span>
                <select class="field__select" name="costType">
                  ${COST_TYPES.map((ct) => `<option value="${ct.id}" ${ct.id === lastTimeCostType ? 'selected' : ''}>${esc(costTypeLabel(ct.id))}</option>`).join('')}
                </select>
              </label>
            </div>
            <p class="time-log__preview" id="costPreview" aria-live="polite"></p>
          </fieldset>
          <div id="timeLogEntries">${timeLogListHTML(item)}</div>
        </div>`,
      onSubmit: (v) => {
        const unit = TIME_UNITS.find((u) => u.id === v.unit) || TIME_UNITS[0];
        lastTimeUnit = unit.id;
        const amount = Number(String(v.amount).trim().replace(',', '.'));
        const minutes = Math.round(amount * unit.minutes);
        if (!(minutes > 0)) { toast(t('time_min'), true); return; }
        const note = String(v.note || '').trim();
        const loggedAt = new Date().toISOString();
        const person = personFor(checklist, v.person);
        const log = { id: uid(), minutes, note, loggedAt, personId: person.id, costId: '' };

        // Optional cost of this time: a total, or a rate × the time (which also becomes the person's hourly rate)
        let cost = null;
        const rawCost = String(v.costAmount || '').trim();
        if (rawCost) {
          const price = round2(Number(rawCost.replace(',', '.')));
          const currency = CURRENCIES.includes(v.costCurrency) ? v.costCurrency : DEFAULT_CURRENCY;
          const perHour = v.costMode !== 'total';
          lastTimeCostMode = perHour ? 'hour' : 'total';
          lastTimeCostType = COST_TYPES.some((ct) => ct.id === v.costType) ? v.costType : 'labor';
          lastCurrency = currency;
          cost = normalizeCost({ type: lastTimeCostType, amount: perHour ? price * minutes / 60 : price, currency, note, loggedAt, personId: person.id });
          if (!cost) { toast(t('cost_zero'), true); return; }
          if (perHour && price > 0) person.rate = { amount: price, currency };
          cost.timeLogId = log.id;
          log.costId = cost.id;
          item.costs.push(cost);
        }
        item.timeLogs.push(log);
        commit();
        toast(cost
          ? t('logged_with_cost', { time: formatDuration(minutes), cost: formatMoney(cost.amount, cost.currency) })
          : t('logged', { time: formatDuration(minutes), total: formatDuration(sumMinutes([item])) }));
      }
    });
    bindPersonAutocomplete();
    bindTimeCost();
    // Remove entries in place (the list element is recreated on every open)
    const box = $('#timeLogEntries');
    bindEntryRemoval(box, item, 'time', timeLogListHTML);
  }

  // Time form: live preview of the cost, and the person's last hourly rate filled in when picked
  function bindTimeCost() {
    const field = (name) => modalBody.querySelector(`[name="${name}"]`);
    const amountEl = field('amount'), unitEl = field('unit');
    const costEl = field('costAmount'), currencyEl = field('costCurrency'), modeEl = field('costMode');
    const personEl = $('#personInput');
    const preview = $('#costPreview');
    let autoRate = '';  // amount filled in from a person's rate (replaced or cleared while left untouched)
    let rateFrom = '';  // that person's name, for the hint
    let before = null;  // currency + price mode before the first auto-fill, restored when it is cleared
    const minutesNow = () => {
      const unit = TIME_UNITS.find((u) => u.id === unitEl.value) || TIME_UNITS[0];
      const n = Number(String(amountEl.value).trim().replace(',', '.'));
      return n > 0 ? Math.round(n * unit.minutes) : 0;
    };
    function updatePreview() {
      const parts = [];
      const raw = costEl.value.trim();
      const price = Number(raw.replace(',', '.'));
      if (rateFrom && raw === autoRate) parts.push(esc(t('rate_hint', { name: rateFrom })));
      if (raw && price > 0) {
        const cur = currencyEl.value;
        const strong = (amount) => `<strong>${esc(formatMoney(round2(amount), cur))}</strong>`;
        if (modeEl.value === 'total') parts.push(t('cost_preview', { amount: strong(price) }));
        else if (minutesNow()) {
          parts.push(t('cost_preview_rate', {
            rate: esc(formatMoney(price, cur) + t('per_hour_short')),
            time: esc(formatDuration(minutesNow())),
            amount: strong(price * minutesNow() / 60)
          }));
        }
      }
      preview.innerHTML = parts.join(' · ');
    }
    function applyPersonRate() {
      const p = personKey(personEl.value) ? findPerson(checklist, personEl.value) : null;
      const untouched = !costEl.value.trim() || costEl.value === autoRate;
      if (p && p.rate && untouched) {
        if (!autoRate) before = { currency: currencyEl.value, mode: modeEl.value };
        autoRate = p.rate.amount.toFixed(2);
        costEl.value = autoRate;
        currencyEl.value = p.rate.currency;
        modeEl.value = 'hour';
        rateFrom = personName(checklist, p.id);
      } else if (untouched && autoRate) {
        costEl.value = '';
        if (before) { currencyEl.value = before.currency; modeEl.value = before.mode; }
        autoRate = '';
        rateFrom = '';
        before = null;
      }
      updatePreview();
    }
    personEl.addEventListener('input', applyPersonRate);
    personEl.addEventListener('change', applyPersonRate);
    [amountEl, unitEl, costEl, currencyEl, modeEl].forEach((el) => {
      el.addEventListener('input', updatePreview);
      el.addEventListener('change', updatePreview);
    });
  }

  /* ---- Costs: add entries (type, amount + currency, text), optionally linked to a time entry; remove existing ones ---- */
  let lastCurrency = DEFAULT_CURRENCY;
  let lastCostType = 'other';
  function costListHTML(item) {
    const totals = sumCosts([item]);
    const entries = item.costs.slice().reverse(); // newest first
    return `
      <div class="time-log__summary"><span>${esc(t('total_costs'))}</span><span class="time-log__total">${totals.length ? esc(formatCostTotals(totals)) : formatMoney(0, lastCurrency)}</span></div>
      ${entries.length ? `<ul class="time-log__list">${entries.map((c) => {
        const log = linkedLog(item, c);
        const who = personName(checklist, c.personId);
        return `
        <li class="time-log__entry" data-entry="${esc(c.id)}">
          <span class="time-log__amount">${esc(formatMoney(c.amount, c.currency))}</span>
          ${log ? linkBadge(formatDuration(log.minutes), t('linked_time_title', { time: formatDuration(log.minutes) })) : ''}
          <span class="time-log__type">${esc(costTypeLabel(c.type))}</span>
          <span class="time-log__note" title="${esc(c.note)}">${esc(c.note)}</span>
          <span class="time-log__person" title="${esc(who)}">${esc(who)}</span>
          <span class="time-log__date">${c.loggedAt ? esc(formatDMYTime(c.loggedAt)) : ''}</span>
          <button type="button" class="button button--icon button--icon-danger time-log__remove" data-log="${esc(c.id)}" aria-label="${esc(t('remove_cost'))}" title="${esc(t('remove_cost'))}">${icons.close}</button>
        </li>`;
      }).join('')}</ul>` : `<p class="time-log__empty">${esc(t('no_costs'))}</p>`}`;
  }
  function openCosts(item) {
    // time entries of this item that don't have a cost yet (newest first)
    const freeLogs = item.timeLogs.filter((l) => !linkedCost(item, l)).reverse();
    const logLabel = (l) => [formatDuration(l.minutes), personName(checklist, l.personId), l.loggedAt ? formatDMYTime(l.loggedAt) : '', l.note]
      .filter(Boolean).join(' · ');
    openModal({
      title: t('costs'),
      subtitle: item.title,
      submitLabel: t('add_cost'),
      cancelLabel: t('close'),
      html: `
        <div class="time-log">
          <div class="time-log__inputs time-log__inputs--cost">
            <label class="field">
              <span class="field__label">${esc(t('amount'))}</span>
              <input class="field__input" name="amount" inputmode="decimal" autocomplete="off" required
                     pattern="${amountPattern}" placeholder="${esc(t('amount_ph'))}" title="${esc(t('amount_hint'))}">
            </label>
            <label class="field">
              <span class="field__label">${esc(t('currency'))}</span>
              <select class="field__select" name="currency">
                ${CURRENCIES.map((c) => `<option value="${c}" ${c === lastCurrency ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
            </label>
            <label class="field">
              <span class="field__label">${esc(t('type'))}</span>
              <select class="field__select" name="type">
                ${COST_TYPES.map((ct) => `<option value="${ct.id}" ${ct.id === lastCostType ? 'selected' : ''}>${esc(costTypeLabel(ct.id))}</option>`).join('')}
              </select>
            </label>
          </div>
          <label class="field">
            <span class="field__label">${esc(t('text'))}</span>
            <input class="field__input" name="note" autocomplete="off" placeholder="${esc(t('text_ph'))}">
          </label>
          ${freeLogs.length ? `
          <label class="field">
            <span class="field__label">${esc(t('linked_time'))}</span>
            <select class="field__select" name="timeLogId">
              <option value="">${esc(t('linked_none'))}</option>
              ${freeLogs.map((l) => `<option value="${esc(l.id)}">${esc(logLabel(l))}</option>`).join('')}
            </select>
          </label>` : ''}
          ${personFieldHTML()}
          <div id="costEntries">${costListHTML(item)}</div>
        </div>`,
      onSubmit: (v) => {
        lastCurrency = CURRENCIES.includes(v.currency) ? v.currency : DEFAULT_CURRENCY;
        lastCostType = COST_TYPES.some((t) => t.id === v.type) ? v.type : 'other';
        const cost = normalizeCost({
          type: lastCostType,
          amount: String(v.amount).trim().replace(',', '.'),
          currency: lastCurrency,
          note: String(v.note || '').trim(),
          loggedAt: new Date().toISOString()
        });
        if (!cost) { toast(t('amount_min'), true); return; }
        cost.personId = personFor(checklist, v.person).id;
        const log = v.timeLogId ? item.timeLogs.find((l) => l.id === v.timeLogId && !linkedCost(item, l)) : null;
        if (log) { cost.timeLogId = log.id; log.costId = cost.id; }
        item.costs.push(cost);
        commit();
        toast(t('cost_added', { amount: formatMoney(cost.amount, cost.currency), total: formatCostTotals(sumCosts([item])) }));
      }
    });
    bindPersonAutocomplete();
    // Picking a time entry fills in its person when the Person field is still empty
    const logSelect = modalBody.querySelector('[name="timeLogId"]');
    if (logSelect) {
      logSelect.addEventListener('change', () => {
        const log = item.timeLogs.find((l) => l.id === logSelect.value);
        const personEl = $('#personInput');
        if (log && !personEl.value.trim()) personEl.value = personName(checklist, log.personId);
      });
    }
    bindEntryRemoval($('#costEntries'), item, 'cost', costListHTML);
  }

  /* ---- Time / Cost Report ----
     Totals per person, overall, per stage → item, charts and every entry. Time and cost logged
     together (a time entry with its linked cost) are kept apart from time and costs logged on
     their own. Figures: { minutes, linkedMinutes, linkedCosts, otherCosts } (costs: currency → amount). */
  const emptyFigures = () => ({ minutes: 0, linkedMinutes: 0, linkedCosts: new Map(), otherCosts: new Map() });
  const addMoney = (map, currency, amount) => map.set(currency, round2((map.get(currency) || 0) + amount));
  const mergeMoney = (...maps) => { const out = new Map(); maps.forEach((m) => m.forEach((a, c) => addMoney(out, c, a))); return out; };
