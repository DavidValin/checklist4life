  const moneyText = (map) => formatCostTotals(Array.from(map, ([currency, amount]) => ({ currency, amount })));
  // Figures of the entries in `items`, grouped by key(entry, item)
  function figuresBy(items, key) {
    const out = new Map();
    const of = (k) => { if (!out.has(k)) out.set(k, emptyFigures()); return out.get(k); };
    items.forEach((item) => {
      item.timeLogs.forEach((log) => {
        const f = of(key(log, item));
        f.minutes += log.minutes;
        if (linkedCost(item, log)) f.linkedMinutes += log.minutes;
      });
      item.costs.forEach((cost) => {
        const f = of(key(cost, item));
        addMoney(linkedLog(item, cost) ? f.linkedCosts : f.otherCosts, cost.currency, cost.amount);
      });
    });
    return out;
  }
  const figuresOf = (items) => figuresBy(items, () => '').get('') || emptyFigures();

  // Donut: share of a whole. parts: [{ label, value }] in entity order (colours follow that order).
  // At most 6 slices: the 5 largest parts, the rest folded into one grey slice. Skipped with < 2 parts.
  function donutHTML(title, parts, fmt) {
    parts = parts.filter((p) => p.value > 0);
    if (parts.length < 2) return '';
    const total = parts.reduce((sum, p) => sum + p.value, 0);
    let shown = parts;
    if (parts.length > 5) {
      const keep = new Set(parts.slice().sort((a, b) => b.value - a.value).slice(0, 5));
      const rest = parts.filter((p) => !keep.has(p));
      shown = parts.filter((p) => keep.has(p)).concat({
        label: rest.length === 1 ? rest[0].label : t('donut_rest', { n: rest.length }),
        value: rest.reduce((sum, p) => sum + p.value, 0),
        rest: true
      });
    }
    const pct = (v) => { const p = (v / total) * 100; return p > 0 && p < 1 ? '<1%' : Math.round(p) + '%'; };
    const slot = (p, i) => (p.rest ? 'rest' : i + 1);
    const R = 50, C = 2 * Math.PI * R, GAP = 2; // ring radius / circumference, 2px surface gap between slices
    let offset = 0;
    const slices = shown.map((p, i) => {
      const len = (p.value / total) * C;
      const dash = Math.max(len - GAP, 0.5);
      const slice = `<circle class="donut__slice donut__slice--${slot(p, i)}" cx="60" cy="60" r="${R}" stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"><title>${esc(`${p.label}: ${fmt(p.value)} (${pct(p.value)})`)}</title></circle>`;
      offset += len;
      return slice;
    }).join('');
    const summary = shown.map((p) => `${p.label} ${pct(p.value)}`).join(', ');
    return `
      <figure class="chart">
        <figcaption class="chart__title">${esc(title)}</figcaption>
        <div class="donut">
          <svg class="donut__svg" viewBox="0 0 120 120" role="img" aria-label="${esc(`${title}: ${summary}`)}">
            <g transform="rotate(-90 60 60)">${slices}</g>
            <text class="donut__total" x="60" y="61" text-anchor="middle">${esc(fmt(total))}</text>
            <text class="donut__caption" x="60" y="75" text-anchor="middle">${esc(t('report_total'))}</text>
          </svg>
          <ul class="donut__legend">${shown.map((p, i) => `
            <li><span class="chart__swatch donut__swatch--${slot(p, i)}"></span><span class="donut__name" title="${esc(p.label)}">${esc(p.label)}</span><span class="donut__value">${esc(fmt(p.value))}</span><span class="donut__pct">${pct(p.value)}</span></li>`).join('')}
          </ul>
        </div>
      </figure>`;
  }

  function reportHTML() {
    const c = checklist;
    const people = sortedPersons(c);
    const allItems = c.stages.flatMap((s) => s.items);
    const byPersonKey = (entry) => entry.personId;
    const dash = '<span class="report__empty">—</span>';
    const num = (html) => `<td class="report__num">${html || dash}</td>`;
    const time = (m) => (m ? formatDuration(m) : '');
    const money = (map) => (map.size ? esc(moneyText(map)) : '');
    const rate = (f) => (f.linkedMinutes && f.linkedCosts.size
      ? esc(Array.from(f.linkedCosts, ([cur, amount]) => formatMoney(round2(amount / (f.linkedMinutes / 60)), cur) + t('per_hour_short')).join(' · '))
      : '');
    const row = (cls, labelHTML, f, cell = 'td') => `
      <tr class="${cls}"><${cell}>${labelHTML}</${cell}>${num(time(f.minutes))}${num(time(f.linkedMinutes))}${num(time(f.minutes - f.linkedMinutes))}${num(money(f.linkedCosts))}${num(money(f.otherCosts))}${num(money(mergeMoney(f.linkedCosts, f.otherCosts)))}${num(rate(f))}</tr>`;
    const head = (first) => `<thead><tr><th>${esc(first)}</th>${['col_time', 'col_time_with_cost', 'col_time_without_cost', 'col_cost_of_time', 'col_other_costs', 'col_total_costs', 'col_avg_rate']
      .map((k) => `<th class="report__num">${esc(t(k))}</th>`).join('')}</tr></thead>`;
    const personRows = (byPerson) => people.filter((p) => byPerson.has(p.id))
      .map((p) => row('report__person', esc(personName(c, p.id)), byPerson.get(p.id))).join('');
    const table = (first, body, foot) => `<div class="report__scroll"><table class="report__table">${head(first)}<tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`;
    const hasEntries = (i) => i.timeLogs.length || i.costs.length;

    // 1. Totals by person
    const overallByPerson = figuresBy(allItems, byPersonKey);
    const summary = `
      <section>
        <h3 class="report__heading">${esc(t('report_by_person'))}</h3>
        ${table(t('person'), personRows(overallByPerson), row('report__total', esc(t('report_total')), figuresOf(allItems), 'th'))}
      </section>`;

    // 2. Costs by type: how much of each type comes from logged time vs costs logged on their own
    const byType = figuresBy(allItems, (entry) => entry.type || '');
    const usedTypes = COST_TYPES.filter((ct) => byType.has(ct.id));
    const typeRow = (cls, labelHTML, f, cell = 'td') => `
      <tr class="${cls}"><${cell}>${labelHTML}</${cell}>${num(money(f.linkedCosts))}${num(money(f.otherCosts))}${num(money(mergeMoney(f.linkedCosts, f.otherCosts)))}</tr>`;
    const typeTable = usedTypes.length ? `
      <section>
        <h3 class="report__heading">${esc(t('report_by_type'))}</h3>
        <div class="report__scroll"><table class="report__table">
          <thead><tr><th>${esc(t('type'))}</th>${['col_cost_of_time', 'col_other_costs', 'col_total_costs'].map((k) => `<th class="report__num">${esc(t(k))}</th>`).join('')}</tr></thead>
          <tbody>${usedTypes.map((ct) => typeRow('', esc(costTypeLabel(ct.id)), byType.get(ct.id))).join('')}</tbody>
          <tfoot>${typeRow('report__total', esc(t('report_total')), figuresOf(allItems), 'th')}</tfoot>
        </table></div>
      </section>` : '';

    // 3. Charts: donuts with the shares of the whole (every value is also in the tables)
    const stagesWithEntries = c.stages.filter((s) => s.items.some(hasEntries));
    const stageFigures = stagesWithEntries.map((s) => ({ label: s.title, f: figuresOf(s.items) }));
    const personFigures = people.filter((p) => overallByPerson.has(p.id)).map((p) => ({ label: personName(c, p.id), f: overallByPerson.get(p.id) }));
    const typeFigures = usedTypes.map((ct) => ({ label: costTypeLabel(ct.id), f: byType.get(ct.id) }));
    const currencies = Array.from(new Set(allItems.flatMap((i) => i.costs.map((x) => x.currency))));
    const costIn = (cur) => ({ label, f }) => ({ label, value: (f.linkedCosts.get(cur) || 0) + (f.otherCosts.get(cur) || 0) });
    const charts = [
      donutHTML(t('chart_time_share'), personFigures.map(({ label, f }) => ({ label, value: f.minutes })), formatDuration),
      donutHTML(t('chart_time_stage_share'), stageFigures.map(({ label, f }) => ({ label, value: f.minutes })), formatDuration),
      ...currencies.flatMap((cur) => {
        const fmt = (v) => formatMoney(round2(v), cur);
        return [
          donutHTML(t('chart_cost_person_share', { currency: cur }), personFigures.map(costIn(cur)), fmt),
          donutHTML(t('chart_cost_stage_share', { currency: cur }), stageFigures.map(costIn(cur)), fmt),
          donutHTML(t('chart_cost_share', { currency: cur }), typeFigures.map(costIn(cur)), fmt)
        ];
      })
    ].join('');

    // 4. Per stage → item → person
    const stages = stagesWithEntries.map((stage) => {
      const items = stage.items.filter(hasEntries)
        .map((item) => row('report__item', esc(item.title), figuresOf([item]), 'th') + personRows(figuresBy([item], byPersonKey))).join('');
      return `
        <section>
          <h3 class="report__heading">${esc(stage.title)}</h3>
          ${table(t('report_item_person'), items, row('report__total', esc(t('report_stage_total')), figuresOf(stage.items), 'th') + personRows(figuresBy(stage.items, byPersonKey)))}
        </section>`;
    }).join('');

    // 5. Every entry, oldest first: a time entry and its linked cost share one row
    const entries = [];
    c.stages.forEach((stage) => stage.items.forEach((item) => {
      item.timeLogs.forEach((log) => {
        const cost = linkedCost(item, log);
        const who = cost && cost.personId !== log.personId ? [log.personId, cost.personId] : [log.personId];
        entries.push({ at: log.loggedAt, stage, item, people: who, minutes: log.minutes, cost, note: log.note || (cost ? cost.note : '') });
      });
      item.costs.filter((cost) => !linkedLog(item, cost))
        .forEach((cost) => entries.push({ at: cost.loggedAt, stage, item, people: [cost.personId], minutes: 0, cost, note: cost.note }));
    }));
    entries.sort((a, b) => (a.at || '').localeCompare(b.at || ''));
    const entryRows = entries.map((e) => `
      <tr>
        <td class="report__date">${e.at ? esc(formatDMYTime(e.at)) : ''}</td>
        <td>${esc(e.stage.title)} › ${esc(e.item.title)}</td>
        <td>${esc(e.people.map((id) => personName(c, id)).join(' / '))}</td>
        <td class="report__num">${e.minutes ? formatDuration(e.minutes) : dash}</td>
        <td class="report__num">${e.cost ? (e.minutes ? `<span class="report__link" title="${esc(t('legend_linked'))}">${icons.link}</span>` : '') + esc(formatMoney(e.cost.amount, e.cost.currency)) : dash}</td>
        <td>${e.cost ? esc(costTypeLabel(e.cost.type)) : ''}</td>
        <td class="report__note">${esc(e.note)}</td>
      </tr>`).join('');
    const entriesTable = `
      <section>
        <h3 class="report__heading">${esc(t('report_entries'))}</h3>
        <div class="report__scroll"><table class="report__table report__table--entries">
          <thead><tr>${['col_date', 'col_where', 'person', 'col_time', 'col_cost', 'type', 'col_note']
            .map((k) => `<th class="${k === 'col_time' || k === 'col_cost' ? 'report__num' : ''}">${esc(t(k))}</th>`).join('')}</tr></thead>
          <tbody>${entryRows}</tbody>
        </table></div>
      </section>`;

    return `
      <div class="report">
        <div class="report__bar">
          <p class="report__meta">${esc(t('report_generated', { date: formatDMYTime(new Date().toISOString()) }))}<br>${esc(t('report_linked_hint'))}</p>
          <button type="button" class="button report__print" id="reportPrint">${icons.print}${esc(t('print'))}</button>
        </div>
        ${summary}
        ${typeTable}
        ${charts ? `<section><h3 class="report__heading">${esc(t('report_charts'))}</h3><div class="report__charts">${charts}</div></section>` : ''}
        ${stages}
        ${entriesTable}
      </div>`;
  }

  function openReport() {
    const html = reportHTML();
    openModal({
      title: t('report'),
      subtitle: checklist.title || t('untitled_checklist'),
      wide: true,
      html,
      submitLabel: t('close'),
      hideCancel: true
    });
    // Print: the report is copied into #printRoot, the only element shown when printing
    $('#reportPrint').addEventListener('click', () => {
      $('#printRoot').innerHTML = `
        <h1 class="print-root__title">${esc(t('report'))}</h1>
        <p class="print-root__subtitle">${esc(checklist.title || t('untitled_checklist'))}</p>${html}`;
      window.print();
    });
  }

  /* ---- Print overview: the open checklist on paper (white, simple layout), with optional
     stage descriptions, item descriptions, time, costs and progress (the checklist description is always printed). Built into #printRoot, the only element shown when printing. ---- */
  function overviewHTML(c, opts) {
    // "done/total · pct%" (shown with the progress option)
    const ratio = (items) => {
      const done = items.filter((i) => i.done).length;
      return `${done}/${items.length} · ${items.length ? Math.round((done / items.length) * 100) : 0}%`;
    };
    // time spent · costs, each with its own option
    const totals = (items) => {
      const parts = [];
      const minutes = sumMinutes(items), costs = sumCosts(items);
      if (opts.time && minutes) parts.push(formatDuration(minutes));
      if (opts.costs && costs.length) parts.push(formatCostTotals(costs));
      return parts.join(' · ');
    };
    // a stage's figures, as in the progress panel on the right of the page: time · costs, then the bar
    const stageProgress = (items) => {
      const done = items.filter((i) => i.done).length;
      const pct = items.length ? Math.round((done / items.length) * 100) : 0;
      const sum = totals(items);
      if (!opts.progress) return sum ? `<p class="overview__stage-meta">${esc(sum)}</p>` : '';
      return `
        <div class="overview__progress">
          ${sum ? `<span class="overview__stage-meta">${esc(sum)}</span>` : ''}
          <span class="overview__progress-row">
            <span class="overview__track"><span class="overview__bar" style="width: ${pct}%"></span></span>
            <span class="overview__ratio">${esc(ratio(items))}</span>
          </span>
        </div>`;
    };
    const item = (i) => {
      const extra = [];
      if (opts.time && i.timeLogs.length) extra.push(formatDuration(sumMinutes([i])));
      if (opts.costs && i.costs.length) extra.push(formatCostTotals(sumCosts([i])));
      return `
        <li class="overview__item${i.done ? ' overview__item--done' : ''}">
          <span class="overview__check" aria-hidden="true">${i.done ? '✓' : ''}</span>
          <span class="overview__body">
            <span class="overview__item-title">${esc(i.title)}</span>
            ${opts.itemDescriptions && i.description ? `<span class="overview__item-desc">${esc(i.description)}</span>` : ''}
            ${extra.length ? `<span class="overview__item-meta">${esc(extra.join(' · '))}</span>` : ''}
          </span>
        </li>`;
    };
    const stages = c.stages.map((stage) => `
      <section class="overview__stage">
        <div>
          <h2 class="overview__stage-title">${esc(stage.title)}</h2>
          ${opts.stageDescriptions && stage.description ? `<p class="overview__stage-desc">${esc(stage.description)}</p>` : ''}
          ${stageProgress(stage.items)}
        </div>
        ${stage.items.length ? `<ul class="overview__items" style="--cols: ${stage.columns}">${stage.items.map(item).join('')}</ul>` : '<p class="overview__empty">—</p>'}
      </section>`).join('');
    return `
      <div class="overview">
        <header class="overview__head">
          <div class="overview__head-row">
            <h1 class="overview__title">${esc(c.title || t('untitled_checklist'))}</h1>
            <p class="overview__meta">${esc([
              t('overview_printed', { date: formatDMYTime(new Date().toISOString()) }),
              opts.progress ? ratio(c.stages.flatMap((st) => st.items)) : '',
              totals(c.stages.flatMap((st) => st.items))
            ].filter(Boolean).join(' · '))}</p>
          </div>
          ${c.description ? `<p class="overview__desc">${esc(c.description)}</p>` : ''}
        </header>
        ${stages || `<p class="overview__empty">${esc(t('no_stages_panel'))}</p>`}
      </div>`;
  }
  function openPrintOverview() {
    openModal({
      title: t('print_overview'),
      subtitle: t('overview_subtitle'),
      fields: [
        { name: 'includeStageDescriptions', type: 'checkbox', label: t('include_stage_descriptions'), value: true },
        { name: 'includeItemDescriptions', type: 'checkbox', label: t('include_item_descriptions'), value: true },
        { name: 'includeTime', type: 'checkbox', label: t('include_time'), value: true },
        { name: 'includeCosts', type: 'checkbox', label: t('include_costs'), value: true },
        { name: 'includeProgress', type: 'checkbox', label: t('include_progress'), value: true }
      ],
      submitLabel: t('print'),
      onSubmit: (values, formData) => {
        save();
        $('#printRoot').innerHTML = overviewHTML(checklist, {
          stageDescriptions: formData.has('includeStageDescriptions'),
          itemDescriptions: formData.has('includeItemDescriptions'),
          time: formData.has('includeTime'),
          costs: formData.has('includeCosts'),
          progress: formData.has('includeProgress')
        });

      }

  const columnsField = (value) => ({
    name: 'columns', label: t('columns'), type: 'select', value,
    options: COLUMN_OPTIONS.map((n) => ({ value: n, label: tn('n_columns', n) }))
  });

  function moveStage(stage, dir) {
    const i = checklist.stages.indexOf(stage);
    const j = i + dir;
    if (j < 0 || j >= checklist.stages.length) return;
    [checklist.stages[i], checklist.stages[j]] = [checklist.stages[j], checklist.stages[i]];
    commit();
  }

  /* ==================================================================
     Export (file format version 2)
     ================================================================== */
  const EXPORT_VERSION = 2;
  const slugify = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  function downloadJSON(data, filename) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  const exportable = (c) => ({ id: c.id, title: c.title, description: c.description, updatedAt: c.updatedAt, stages: c.stages, persons: c.persons });

  // includeFiles → each exported checklist gets `files: [{ id, name, type, size, data (base64) }]`
  async function exportChecklists(list, includeFiles) {
    const out = list.map(exportable);
    let missing = 0;
    if (includeFiles && list.some((c) => allAttachments(c).length)) {
      toast(t('export_preparing'));
      try {
        for (let k = 0; k < list.length; k++) {
          const r = await filesForExport(list[k]);
          missing += r.missing;
          if (r.files.length) out[k].files = r.files;
        }
      } catch (e) { toast(t('export_read_failed'), true); return; }
    }
    const note = missing ? t('export_missing', { attachments: tn('n_attachments', missing) }) : '';
    if (list.length === 1) {
      const c = list[0];
      downloadJSON({ app: 'checklist-app', version: EXPORT_VERSION, type: 'checklist', ...out[0] }, `${slugify(c.title) || 'checklist'}-${c.id}.json`);
      toast(t('exported_one', { title: c.title || t('untitled_checklist'), note }), missing > 0);
      return;
    }
    const now = new Date().toISOString();
    downloadJSON(
      { app: 'checklist-app', version: EXPORT_VERSION, type: 'checklists', exportedAt: now, checklists: out },
      `checklists-${list.length}-${now.slice(0, 10)}.json`
    );
    toast(t('exported_many', { checklists: tn('n_checklists', list.length), note }), missing > 0);
  }

  function openExportModal() {
    save(); // include the latest edits of the open checklist
    const all = listChecklists();
    const rows = all.map((c) => {
      const s = checklistStats(c);
      const current = c.id === checklist.id;
      return `
        <li>
          <label class="pick-list__row">
            <input type="checkbox" class="pick-list__check" name="checklist" value="${esc(c.id)}" ${current ? 'checked' : ''}>
            <span class="pick-list__text">
              <span class="pick-list__title">${esc(c.title || t('untitled_checklist'))}${current ? `<span class="pick-list__badge">${esc(t('current'))}</span>` : ''}</span>
              <span class="pick-list__meta"><code class="pick-list__id">${esc(c.id)}</code> · ${esc(tn('n_stages', s.stages))} · ${esc(t('done_count', { done: s.done, total: s.items }))}</span>
            </span>
          </label>
        </li>`;
    }).join('');

    openModal({
      title: t('export_title'),
      subtitle: t('export_subtitle'),
      submitLabel: t('export'),
      html: `
        <div class="pick-list" id="exportList">
          <div class="pick-list__bar">
            <span class="pick-list__count" id="exportCount"></span>
            <button type="button" class="button button--ghost pick-list__toggle" id="exportToggleAll"></button>
          </div>
          <ul class="pick-list__items">${rows}</ul>
        </div>
        ${fieldHTML({ name: 'includeFiles', type: 'checkbox', label: t('include_attachments'), hint: t('include_attachments_hint'), value: true })}`,
      onSubmit: (values, formData) => {
        const ids = formData.getAll('checklist');
        const selected = all.filter((c) => ids.includes(c.id));
        if (selected.length) exportChecklists(selected, formData.has('includeFiles'));
      }
    });

    // Select all / none + live count (elements are recreated on every open)
    const list = $('#exportList');
    const boxes = Array.from(list.querySelectorAll('.pick-list__check'));
    const toggleAll = $('#exportToggleAll');
    const sync = () => {
      const n = boxes.filter((b) => b.checked).length;
      boxes.forEach((b) => b.closest('.pick-list__row').classList.toggle('pick-list__row--checked', b.checked));
      $('#exportCount').textContent = t('selected_count', { n, total: boxes.length });
      toggleAll.textContent = t(n === boxes.length ? 'select_none' : 'select_all');
      modalSubmit.disabled = n === 0;
    };
    toggleAll.addEventListener('click', () => {
      const selectAll = boxes.some((b) => !b.checked);
      boxes.forEach((b) => { b.checked = selectAll; });
      sync();
    });
    list.addEventListener('change', sync);
    sync();
  }

  /* ==================================================================
     Import
     For every checklist in the file:
       - id not saved yet → add it
       - id already saved → ask for confirmation to override (Override / Skip / Override all)
     ================================================================== */
  function parseImportFile(parsed) {
    let raws;
    if (Array.isArray(parsed)) raws = parsed;
    else if (parsed && parsed.type === 'checklists' && Array.isArray(parsed.checklists)) raws = parsed.checklists;
    else if (parsed && Array.isArray(parsed.documents)) raws = parsed.documents; // earlier multi-export format
    else raws = [parsed];
    if (!raws.length) throw userError('err_no_checklists');

    const list = raws.map((raw) => {
      const c = normalizeChecklist(raw);
      c.defaultTemplate = ''; // an imported checklist is never the default checklist
      // embedded attachment files (not saved with the checklist; stored in IndexedDB on import)
      c.importFiles = Array.isArray(raw.files)
        ? raw.files.filter((f) => f && isFileId(f.id) && typeof f.data === 'string')
        : [];
      return c;
    });
    // ids must also be unique within the file itself
    const seen = new Set();
    list.forEach((c) => {
      if (seen.has(c.id)) c.id = newChecklistId(Array.from(seen));
      seen.add(c.id);
    });
    return list;
  }

  function importChecklists(list, filesFailed = 0) {
    save();
    const added = [];
    const overridden = [];
    const skipped = [];
    const failed = [];
    const conflicts = [];

    list.forEach((c) => {
      if (readChecklist(c.id)) conflicts.push(c);
      else if (writeChecklist(c)) added.push(c);
      else failed.push(c);
    });

    const override = (c) => { (writeChecklist(c) ? overridden : failed).push(c); };

    const finish = () => {
      const touched = added.concat(overridden);
      if (touched.length) {
        // Re-open the current checklist if it was overridden, otherwise the first imported one
        const target = touched.find((c) => c.id === checklist.id) || touched[0];
        openChecklist(readChecklist(target.id) || target);
      } else {
        render();
      }
      const parts = [];
      if (added.length) parts.push(t('import_added', { n: added.length }));
      if (overridden.length) parts.push(t('import_overridden', { n: overridden.length }));
      if (skipped.length) parts.push(t('import_skipped', { n: skipped.length }));
      if (failed.length) parts.push(t('import_failed', { n: failed.length }));
      if (filesFailed) parts.push(t('import_files_failed', { attachments: tn('n_attachments', filesFailed) }));
      toast(t('import_result', { parts: parts.join(' · ') || t('import_nothing') }), failed.length > 0 || filesFailed > 0);
      scheduleGc(65000); // drop files of skipped / overridden checklists once they're no longer recent
    };

    const ask = (index) => {
      if (index >= conflicts.length) { finish(); return; }
      const incoming = conflicts[index];
      const existing = readChecklist(incoming.id);
      const remaining = conflicts.length - index;
      openModal({
        title: t('override_q'),
        subtitle: conflicts.length > 1 ? t('conflict_n', { i: index + 1, n: conflicts.length }) : '',
        messageHTML:
          t('override_exists', {
            id: `<strong>${esc(incoming.id)}</strong>`,
            title: `<strong>${esc(existing ? existing.title || t('untitled_checklist') : incoming.id)}</strong>`,
            updated: existing && existing.updatedAt ? esc(t('override_updated', { date: formatDate(existing.updatedAt) })) : ''
          }) + '<br><br>' +
          t('override_confirm', {
            title: `<strong>${esc(incoming.title || t('untitled_checklist'))}</strong>`,
            stages: esc(tn('n_stages', incoming.stages.length))
          }),
        submitLabel: t('override'), danger: true,
        cancelLabel: t('skip'),
        altLabel: remaining > 1 ? t('override_all', { n: remaining }) : '',
        onSubmit: () => { override(incoming); ask(index + 1); },
        onAlt: () => { conflicts.slice(index).forEach(override); finish(); },
        onCancel: () => { skipped.push(incoming); ask(index + 1); }
      });
    };

    ask(0);
  }

  $('#importInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let list;
      try { list = parseImportFile(JSON.parse(reader.result)); }
      catch (err) { toast(err && err.userFacing ? err.message : t('parse_failed'), true); return; }
      storeImportedFiles(list).then((filesFailed) => importChecklists(list, filesFailed));
    };
    reader.onerror = () => toast(t('read_failed'), true);
    reader.readAsText(file);
  });

  /* ==================================================================
     Events
     ================================================================== */
  document.addEventListener('click', (e) => {
    // Close the switcher when clicking anywhere outside it
    if (!switcherPanel.hidden && !switcherEl.contains(e.target)) closeSwitcher();
    if (!langPanel.hidden && !langEl.contains(e.target)) closeLangMenu();
    if (isMenuOpen() && !e.target.closest('.toolbar')) setMenu(false);

    const el = e.target.closest('[data-action]');
    if (!el || el.tagName === 'SELECT' || !document.getElementById('page').contains(el)) return;
    const action = actions[el.dataset.action];
    if (!action) return;
    const stageEl = el.closest('[data-stage]');
    const itemEl = el.closest('[data-item]');
    const stage = stageEl ? findStage(stageEl.dataset.stage) : null;
    const item = itemEl ? findItem(stage, itemEl.dataset.item) : null;
    if (el.type === 'checkbox') e.preventDefault(); // state is re-rendered from data
    action({ stage, item, el });
    if (isMenuOpen() && MENU_CLOSING_ACTIONS.has(el.dataset.action)) setMenu(false);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    // one layer at a time: an open dropdown first, then the mobile menu
    if (!switcherPanel.hidden) { closeSwitcher(); switcherToggle.focus(); }
    else if (!langPanel.hidden) { closeLangMenu(); langToggle.focus(); }
    else if (isMenuOpen() && !modal.open) { setMenu(false); document.getElementById('toolbarBurger').focus(); }
  });

  // Navigating to #<id> (bookmark or manual edit) opens that checklist
  window.addEventListener('hashchange', () => {
    const id = hashId();
    if (!id || id === checklist.id) return;
    const c = isValidId(id) && readChecklist(id);
    if (c) { save(); openChecklist(c); }
    else { toast(t('no_such_id'), true); setActive(checklist.id); }
  });

  // Keep in sync when checklists change in another tab
  window.addEventListener('storage', (e) => {
    if (e.key === PREFS_KEY && e.newValue) {
      try {
        Object.assign(prefs, JSON.parse(e.newValue));
        if (!isLang(prefs.lang)) prefs.lang = DEFAULT_LANG;
        if (prefs.lang !== lang) applyLang(); else applyPrefs();
      } catch (err) { /* ignore */ }
      return;
    }
    if (!e.key || !e.key.startsWith(CHECKLIST_PREFIX)) return;
    if (e.key === CHECKLIST_PREFIX + checklist.id && e.newValue) {
      const c = readChecklist(checklist.id);
      if (c) { checklist = c; render(); }
    } else {
      setSwitcherCount(savedIds().length);
      if (!switcherPanel.hidden) renderSwitcher();
    }
  });

  // Inline-editable checklist title & description (autosaved on every keystroke)
  function bindEditable(el, key) {
    el.addEventListener('input', () => {
      checklist[key] = el.innerText.replace(/\n+$/, '');
      save();
      if (key === 'title') document.title = checklist.title || t('app_title');
    });
    el.addEventListener('blur', () => { if (!el.innerText.trim()) el.textContent = ''; });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (key === 'title' || !e.shiftKey)) { e.preventDefault(); el.blur(); }
      if (e.key === 'Escape') el.blur();
    });
    el.addEventListener('paste', (e) => { // paste as plain text
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, key === 'title' ? text.replace(/\s*\n\s*/g, ' ') : text);
    });
  }
  bindEditable(titleEl, 'title');
  bindEditable(descEl, 'description');

  // Extra safety: flush the open checklist when the tab is hidden or closed
  // …unless it was deleted meanwhile (storage cleared, or deleted in another tab): never bring it back
  const flush = () => { if (store.get(CHECKLIST_PREFIX + checklist.id) !== null) save(); };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  /* ==================================================================
     Toast
     ================================================================== */
  let toastTimer;
  function toast(msg, isError = false) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast toast--visible' + (isError ? ' toast--error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast' + (isError ? ' toast--error' : ''); }, 3000);
  }

  /* ==================================================================
     Tutorial: a guided tour over the real controls, shown once to everyone (prefs.tourDone)
     and replayed with the "?" button. Each step highlights its targets (dimming the rest) and
     explains them in a bubble; steps whose targets aren't on screen (e.g. no stages yet, or the
     toolbar folded into the burger menu) point at a fallback or show the bubble centred.
     ================================================================== */
  const tourEl = $('#tour');
  const tourSpot = $('#tourSpot');
  const tourBubble = $('#tourBubble');
  const firstTourItem = () => stagesEl.querySelector('.item:not(.item--done)') || stagesEl.querySelector('.item');
  const inItem = (sel) => () => { const it = firstTourItem(); return it ? [...it.querySelectorAll(sel)] : []; };
  const toolbarItem = (sel) => document.querySelector('.toolbar ' + sel);
  const TOUR_STEPS = [
    { id: 'welcome' },
    { id: 'checklist', targets: () => [titleEl, descEl] },
    { id: 'stage', targets: () => [stagesEl.querySelector('.stage__heading')] },
    { id: 'stage_actions', targets: () => [stagesEl.querySelector('.stage__actions')] },
    { id: 'add_stage', targets: () => [stagesEl.querySelector('[data-action="add-stage"]')] },
    { id: 'check', targets: inItem('.item__check, .item__title') },
    { id: 'item_actions', targets: inItem('.item__actions') },
    { id: 'time', targets: inItem('[data-action="log-time"], [data-action="log-cost"]') },
    { id: 'progress', targets: () => [$('#progressPanel')] },
    { id: 'report', targets: () => [$('#reportButton'), $('#printOverviewButton')] },
    { id: 'checklists', targets: () => [toolbarItem('.toolbar__group [data-action="new-checklist"]'), toolbarItem('[data-action="clone-checklist"]'), $('#switcherToggle')], fallback: true },
    { id: 'display', targets: () => [$('#settings'), $('#lang')], fallback: true },
    { id: 'backup', targets: () => [toolbarItem('[data-action="import"]'), toolbarItem('[data-action="export"]')], fallback: true },
    { id: 'end', targets: () => [$('#helpButton')], fallback: true }
  ];
  let tourIndex = -1;
  const tourOpen = () => tourIndex >= 0;
  const isShown = (el) => { if (!el) return false; const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
  // Visible targets of a step; toolbar steps fall back to the burger button when folded into the menu
  function tourTargets(step) {
    if (!step.targets) return [];
    const els = step.targets().filter(isShown);
    if (!els.length && step.fallback && isShown($('#toolbarBurger'))) return [$('#toolbarBurger')];
    return els;
  }
  function tourRect(els) {
    const rects = els.map((el) => el.getBoundingClientRect());
    const pad = 6;
    return {
      top: Math.min(...rects.map((r) => r.top)) - pad,
      left: Math.min(...rects.map((r) => r.left)) - pad,
      right: Math.max(...rects.map((r) => r.right)) + pad,
      bottom: Math.max(...rects.map((r) => r.bottom)) + pad
    };
  }
  // Spotlight around the targets, bubble below / above / beside them (or centred when there are none)
  function placeTour() {
    if (!tourOpen()) return;
    const vw = window.innerWidth, vh = window.innerHeight, gap = 12, margin = 12;
    const bw = tourBubble.offsetWidth, bh = tourBubble.offsetHeight;
    const els = tourTargets(TOUR_STEPS[tourIndex]);
    let top, left;
    if (!els.length) {
      tourSpot.classList.add('tour__spot--none');
      top = (vh - bh) / 2;
      left = (vw - bw) / 2;
    } else {
      const r = tourRect(els);
      tourSpot.classList.remove('tour__spot--none');
      Object.assign(tourSpot.style, { top: r.top + 'px', left: r.left + 'px', width: (r.right - r.left) + 'px', height: (r.bottom - r.top) + 'px' });
      const centreX = Math.min(Math.max((r.left + r.right) / 2 - bw / 2, margin), vw - bw - margin);
      if (r.bottom + gap + bh <= vh - margin) { top = r.bottom + gap; left = centreX; }
      else if (r.top - gap - bh >= margin) { top = r.top - gap - bh; left = centreX; }
      else if (r.left - gap - bw >= margin) { left = r.left - gap - bw; top = Math.min(Math.max(r.top, margin), vh - bh - margin); }
      else if (r.right + gap + bw <= vw - margin) { left = r.right + gap; top = Math.min(Math.max(r.top, margin), vh - bh - margin); }
      else { left = centreX; top = vh - bh - margin; }
    }
    tourBubble.style.top = Math.max(margin, top) + 'px';
    tourBubble.style.left = Math.max(margin, left) + 'px';
  }
  let tourFrame = 0;
  const scheduleTour = () => { cancelAnimationFrame(tourFrame); tourFrame = requestAnimationFrame(placeTour); };
  function showTourStep(i) {
    tourIndex = i;
    const step = TOUR_STEPS[i];
    const last = i === TOUR_STEPS.length - 1;
    $('#tourCount').textContent = t('tour_step', { n: i + 1, total: TOUR_STEPS.length });
    $('#tourTitle').textContent = t(`tour_${step.id}_t`);
    $('#tourText').textContent = t(`tour_${step.id}`);
    $('#tourBack').textContent = t('tour_back');
    $('#tourBack').hidden = i === 0;
    $('#tourNext').textContent = t(last ? 'tour_done' : 'tour_next');
    $('#tourSkip').textContent = t('tour_skip');
    $('#tourSkip').hidden = last;
    // bring the targets into view, then place (again once a smooth scroll has settled)
    const els = tourTargets(step);
    if (els.length) {
      const r = tourRect(els);
      if (r.top < 0 || r.bottom > window.innerHeight) els[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    placeTour();
    setTimeout(placeTour, 400);
    $('#tourNext').focus({ preventScroll: true });
  }
  function startTour() {
    closeSwitcher();
    closeLangMenu();
    if (isMenuOpen()) setMenu(false);
    document.documentElement.classList.add('tour-on'); // hover-only buttons stay visible while touring
    tourEl.hidden = false;
    showTourStep(0);
  }
  function endTour() {
    tourEl.hidden = true;
    tourIndex = -1;
    document.documentElement.classList.remove('tour-on');
    prefs.tourDone = true; // never started automatically again
    savePrefs();
  }
  const tourNext = () => (tourIndex < TOUR_STEPS.length - 1 ? showTourStep(tourIndex + 1) : endTour());
  const tourBack = () => { if (tourIndex > 0) showTourStep(tourIndex - 1); };
  $('#tourNext').addEventListener('click', tourNext);
  $('#tourBack').addEventListener('click', tourBack);
  $('#tourSkip').addEventListener('click', endTour);
  window.addEventListener('resize', () => { if (tourOpen()) scheduleTour(); });
  window.addEventListener('scroll', () => { if (tourOpen()) scheduleTour(); }, { passive: true, capture: true });
  // Keyboard: ← / → (Enter on a button activates it), Escape skips; focus stays inside the bubble
  document.addEventListener('keydown', (e) => {
    if (!tourOpen()) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); endTour(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); tourNext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); tourBack(); }
    else if (e.key === 'Tab') {
      const buttons = [...tourBubble.querySelectorAll('button')].filter((b) => !b.hidden);
      const at = buttons.indexOf(document.activeElement);
      e.preventDefault();
      buttons[(at + (e.shiftKey ? -1 : 1) + buttons.length) % buttons.length].focus();
    }
  }, true);

  applyStaticI18n();
  render();
  scheduleGc(5000);
  if (!prefs.tourDone) setTimeout(startTour, 500); // shown once to everyone (replay with the ? button) // clean up files left behind by deleted items/checklists
})();
</script>
</body>
</html>
