<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklists</title>
<script>
  // Apply saved theme before paint (white simple is the default)
  try {
    var prefs = JSON.parse(localStorage.getItem('checklist-app:prefs') || '{}');
    var theme = String(prefs.theme || 'white-simple');
    if (theme === 'dark' || theme.indexOf('black') === 0) document.documentElement.dataset.theme = 'dark';
    if (/-simple$/.test(theme)) document.documentElement.dataset.style = 'simple';
    if (/^(en|es|de|fr|nl|zh|ru)$/.test(prefs.lang)) document.documentElement.lang = prefs.lang;
  } catch (e) {}
</script>
<style>
/* ==========================================================================
   Terminology
   - Checklist : a document (8-char unique id), saved in localStorage
   - Stage     : a section inside a checklist, items laid out in columns
   - Item      : a single checkbox inside a stage (title, description, notes)
   ========================================================================== */

/* ==========================================================================
   Tokens (white theme default, dark theme opt-in)
   ========================================================================== */
:root {
  --bg: #f4f2ee;
  --surface: #ffffff;
  --surface-2: #f9f8f5;
  --border: #e4e0d8;
  --text: #1f1d1a;
  --muted: #6e6a62;
  --accent: #297828;
  --stage-title: #1d5fd1;
  --cost: #9a5b00;
  --cost-soft: #fbeed6;
  --accent-soft: #e3efe9;
  --accent-text: #ffffff;
  --danger: #b4412f;
  --danger-soft: #f8e6e2;
  --done: #9a958c;
  --shadow: 0 1px 2px rgba(31, 29, 26, .06), 0 4px 16px rgba(31, 29, 26, .05);
  --viz-1: #2a78d6;   /* report: link icon (time and cost logged together) */
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4;  /* donut slices */
  --cat-rest: #898781;                                                                       /* donut: folded rest */
  --radius: 12px;
  --radius-sm: 8px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #161614;
  --surface: #1f1f1c;
  --surface-2: #262622;
  --border: #34332e;
  --text: #ecebe6;
  --muted: #a19d93;
  --accent: #6cc3a8;
  --stage-title: #6ea8ff;
  --cost: #f0b45a;
  --cost-soft: #3a2c14;
  --accent-soft: #1f3a32;
  --accent-text: #0f1f1a;
  --danger: #e57b68;
  --danger-soft: #3a2420;
  --done: #77736a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  --viz-1: #3987e5;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }

/* ==========================================================================
   Block: app
   ========================================================================== */
.app {
  max-width: 97%;           /* always (nearly) full width */
  margin: 0 auto;
  padding: 16px 20px 64px;
}
/* Display settings (toolbar settings) */
.app--no-descriptions .stage__description,
.app--no-descriptions .item__description { display: none; }
.app--no-notes .item__notes,
.app--no-notes .item__notes-preview { display: none; }
.app--no-attachments .item__attach,
.app--no-attachments .item__attachments { display: none; }

/* ==========================================================================
   Block: toolbar
   ========================================================================== */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  grid-column: 1 / -1;     /* spans the whole page: Import / Export sit at the right edge of the screen */
  padding: 12px 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.toolbar__group { display: flex; flex-wrap: wrap; gap: 8px; }
.toolbar__group--end { margin-left: auto; }


/* ==========================================================================
   Block: settings (display options in the toolbar, autosaved)
   ========================================================================== */
.settings { align-items: center; gap: 6px; padding-left: 12px; border-left: 1px solid var(--border); }
.settings__theme { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; }
.settings__label { font-size: 13px; font-weight: 600; color: var(--muted); }
.settings__select {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.settings__select:hover { border-color: var(--muted); }
.settings__select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 720px) {
  .settings { padding-left: 0; border-left: 0; }
}

/* ==========================================================================
   Block: toggle-chip (on/off pill backed by a checkbox)
   ========================================================================== */
.toggle-chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  transition: background .15s, border-color .15s, color .15s;
}
/* eye = content shown, crossed-out eye = content hidden */
.toggle-chip__icon { flex: none; width: 15px; height: 15px; }
.toggle-chip__icon--shown,
.toggle-chip--on .toggle-chip__icon--hidden { display: none; }
.toggle-chip--on .toggle-chip__icon--shown { display: block; }
.toggle-chip:hover { border-color: var(--muted); }
.toggle-chip--on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.toggle-chip--focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle-chip__input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }

/* ==========================================================================
   Block: button
   ========================================================================== */
.button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s, opacity .15s, transform .05s;
}
.button:hover { border-color: var(--muted); }
.button:active { transform: translateY(1px); }
.button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.button:disabled { opacity: .45; cursor: not-allowed; }
.button--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.button--primary:hover { border-color: var(--accent); filter: brightness(1.08); }
.button--danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.button--ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 10px; }
.button--ghost:hover { background: var(--surface-2); color: var(--text); border-color: transparent; }
.button--icon {
  padding: 6px;
  border-radius: var(--radius-sm);
  border-color: transparent;
  background: transparent;
  color: var(--muted);
}
.button--icon:hover { background: var(--surface-2); color: var(--text); border-color: transparent; }
.button--icon-danger:hover { background: var(--danger-soft); color: var(--danger); }
.button__icon { width: 16px; height: 16px; flex: none; }

/* Compact toolbar: set by fitToolbar() whenever the items don't fit on one line.
   (Placed after the button styles: the burger is a .button, whose display these rules override.) Only Switch
   (left) and a burger button (right) stay in the bar; the burger opens every other item in a
   full-screen menu. */
.toolbar .toolbar__burger { display: none; } /* hidden unless compact (.toolbar prefix outweighs .button's display) */
/* measuring pass: everything on one line, nothing shrinks */
.toolbar--measure,
.toolbar--measure > .toolbar__group { flex-wrap: nowrap; }
.toolbar--measure > *,
.toolbar--measure > .toolbar__group > * { flex-shrink: 0; white-space: nowrap; }
.toolbar--compact { padding-top: 8px; padding-bottom: 8px; }
.toolbar--compact > .switcher { order: -2; }
.toolbar--compact .toolbar__burger { display: inline-flex; order: -1; margin-left: auto; width: 40px; height: 40px; justify-content: center; }
.toolbar__burger .button__icon { width: 22px; height: 22px; }
.toolbar__burger-close,
.toolbar__burger[aria-expanded="true"] .toolbar__burger-open { display: none; }
.toolbar__burger[aria-expanded="true"] .toolbar__burger-close { display: block; }
.toolbar--compact > .toolbar__group { display: none; }
/* open menu: covers the whole screen, scrolls on its own (the page behind is locked, see .menu-open) */
.toolbar--compact.toolbar--open {
  position: fixed;
  inset: 0;
  z-index: 30;
  align-content: flex-start;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: max(12px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  background: var(--bg);
  backdrop-filter: none;
  border-bottom: 0;
}
:root.menu-open { overflow: hidden; }
.toolbar--compact.toolbar--open > .toolbar__group {
  display: flex;
  flex: 1 1 100%;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  margin-left: 0;
  padding: 14px 0 6px;
  border-top: 1px solid var(--border);
  border-left: 0;
}
.toolbar--compact.toolbar--open .button { justify-content: flex-start; }
.toolbar--compact.toolbar--open .settings { flex-direction: row; flex-wrap: wrap; align-items: center; }
.toolbar--compact.toolbar--open .settings__theme { margin-left: 0; }
/* the language list opens inline inside the menu instead of floating */
.toolbar--compact.toolbar--open .lang__panel { position: static; width: auto; margin-top: 6px; box-shadow: none; animation: none; }
.toolbar--compact.toolbar--open .lang__toggle .lang__chevron { margin-left: auto; }
.toolbar--compact.toolbar--open .lang__toggle { width: 100%; }

/* ==========================================================================
   Block: page (checklist centred in the free space, progress panel at the far right edge)
   ========================================================================== */
.page {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  align-items: start;
}
.page > .app { width: 100%; min-width: 0; }
/* scrolls with the page: each stage's progress sits level with that stage (see alignProgressPanel) */
.page__aside {
  position: relative;
  margin: 16px 20px 24px 0;
}
/* ==========================================================================
   Block: footer
   ========================================================================== */
.footer {
  grid-column: 1 / -1;   /* full width, below the checklist and the progress panel */
  padding: 20px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}
.footer__link { color: var(--accent); font-weight: 600; text-decoration: none; }
.footer__link:hover { text-decoration: underline; }
.footer__link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

@media (max-width: 960px) {
  /* narrow: single column, progress panel at the end of the page */
  .page { grid-template-columns: minmax(0, 1fr); }
  .page__aside { margin: 0 20px 48px; }
}

/* ==========================================================================
   Block: progress-panel
   ========================================================================== */
.progress-panel {
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.progress-panel__heading {
  margin: 0 0 12px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--muted);
}
.progress-panel__total { display: flex; flex-direction: column; gap: 6px; padding-bottom: 14px; }
.progress-panel__total .progress-panel__label { font-weight: 600; color: var(--text); }
.progress-panel__label {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.progress-panel__stages {
  list-style: none;
  margin: 0;
  padding: 10px 0 0;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.progress-panel__stage {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px 8px;
  margin: 0 -8px;
  width: calc(100% + 16px);
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
/* label + total time spent, on one line (time aligned right) */
.progress-panel__row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0; }
.progress-panel__row .progress-panel__label { flex: 1; min-width: 0; }
.progress-panel__time { flex: none; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
/* Aligned mode (wide screens): stage rows are positioned level with their stage */
.progress-panel--aligned .progress-panel__stages { position: relative; padding: 0; border-top: 0; }
.progress-panel--aligned .progress-panel__stages > li { position: absolute; left: 0; right: 0; }
.progress-panel__stage:hover { background: var(--surface-2); }
.progress-panel__stage:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.progress-panel__empty { margin: 0; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.progress--large .progress__track { height: 8px; }
:root[data-style="simple"] .progress-panel { background: transparent; border-color: transparent; box-shadow: none; padding-left: 0; padding-right: 0; }
.stage { scroll-margin-top: 84px; }

/* ==========================================================================
   Block: header (current checklist)
   ========================================================================== */
.header { margin: 16px 0 32px; }
.header__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}
.header__title {
  margin: 0 0 8px;
  font-family: var(--font-display);
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -.01em;
}
.header__description {
  margin: 0;
  max-width: 70ch;
  color: var(--muted);
  font-size: 16px;
  white-space: pre-wrap;
}
/* Title row: title on the left, checklist progress bar on the right */
.header__top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 24px;
  margin-bottom: 8px;
}
.header__top .header__title { flex: 1 1 320px; min-width: 0; margin-bottom: 0; }
.header__report,
.header__print { flex: none; }

/* ==========================================================================
   Block: overview (printed checklist, built into .print-root by "Print overview")
   ========================================================================== */
.overview__head { margin-bottom: 14px; }
.overview__title { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1.2; }
/* title left, "Printed on … · progress · totals" right, on the same line */
.overview__head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
.overview__head-row .overview__title { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.overview__meta { flex: none; max-width: 50%; margin: 0; font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.overview__desc { margin: 8px 0 0; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
.overview__stage { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 18px; padding: 12px 0; border-top: 1px solid var(--border); }
.overview__stage-title { margin: 0; font-family: var(--font-display); font-size: 17px; font-weight: 600; line-height: 1.25; color: var(--stage-title); overflow-wrap: anywhere; }
.overview__stage-desc { margin: 3px 0 0; font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.overview__stage-meta { display: block; margin: 4px 0 0; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.overview__progress { margin-top: 2px; }
.overview__progress-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.overview__track { flex: 1; height: 5px; border-radius: 999px; background: var(--border); overflow: hidden; }
.overview__bar { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.overview__ratio { flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
/* same columns as on screen (1–7); the text gets smaller the more columns a stage has so they fit on the page */
.overview__items {
  --item-font: clamp(9px, calc(15px - var(--cols, 3) * 0.75px), 13px); /* 3 cols ≈ 12.8px, 5 ≈ 11.3px, 7 ≈ 9.8px */
  display: grid;
  grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
  gap: 6px calc(20px - var(--cols, 3) * 1.5px);
  margin: 0;
  padding: 0;
  list-style: none;
  align-content: start;
}
.overview__item { display: flex; align-items: flex-start; gap: 8px; break-inside: avoid; }
.overview__check {
  flex: none;
  display: grid;
  place-content: center;
  width: 13px;
  height: 13px;
  margin-top: 2px;
  border: 1.5px solid var(--muted);
  border-radius: 3px;
  font-size: 10px;
  line-height: 1;
  color: var(--accent-text);
}
.overview__item--done .overview__check { border-color: var(--accent); background: var(--accent); }
.overview__body { display: flex; flex-direction: column; min-width: 0; }
.overview__item-title { font-size: var(--item-font); font-weight: 600; overflow-wrap: anywhere; }
.overview__item--done .overview__item-title { color: var(--done); text-decoration: line-through; }
.overview__item-desc { font-size: max(9px, calc(var(--item-font) - 1px)); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.overview__item-meta { font-size: max(9px, calc(var(--item-font) - 1px)); color: var(--cost); font-variant-numeric: tabular-nums; }
.overview__empty { margin: 0; font-size: 12px; color: var(--muted); }
/* no time or costs yet: greyed out, explained by its tooltip (aria-disabled, not disabled, so the tooltip still shows) */
.header__report[aria-disabled="true"],
.header__report[aria-disabled="true"]:hover { opacity: .45; cursor: not-allowed; border-color: var(--border); }
.header__report[aria-disabled="true"]:active { transform: none; }

/* ==========================================================================
   Block: report (Time / Cost Report modal: totals per person, stage and item)
   ========================================================================== */
.report { display: flex; flex-direction: column; gap: 24px; }
.report__heading { margin: 0 0 6px; font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--stage-title); overflow-wrap: anywhere; }
.report__scroll { overflow-x: auto; }
.report__table { width: 100%; border-collapse: collapse; font-size: 13px; }
.report__table th,
.report__table td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; font-weight: 400; vertical-align: top; }
.report__table thead th { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.report__table .report__num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.report__table .report__item > * { font-weight: 600; background: var(--surface-2); overflow-wrap: anywhere; }
.report__table .report__person > :first-child { padding-left: 26px; color: var(--muted); }
.report__table .report__total > * { font-weight: 700; border-top: 2px solid var(--border); }
.report__table .report__empty { color: var(--done); }
.report__table .report__date { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
.report__table .report__note { color: var(--muted); }
.report__link { display: inline-flex; vertical-align: -2px; margin-right: 4px; color: var(--viz-1); }
.report__link .button__icon { width: 13px; height: 13px; }
.report__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.report__meta { margin: 0; max-width: 75ch; font-size: 12px; color: var(--muted); }
.report__print { flex: none; }

/* ==========================================================================
   Block: chart (donut charts in the report)
   ========================================================================== */
.report__charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 12px; }
.chart { margin: 0; padding: 12px 14px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); break-inside: avoid; }
.chart__title { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.chart__swatch { width: 10px; height: 10px; border-radius: 2px; }
/* donut: share of a whole (ring + legend with amount and percentage) */
.donut { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.donut__svg { flex: none; width: 140px; height: 140px; }
.donut__slice { fill: none; stroke-width: 16; transition: opacity .15s; }
.donut__slice:hover { opacity: .75; }
.donut__total { font-size: 13px; font-weight: 600; fill: var(--text); font-variant-numeric: tabular-nums; }
.donut__caption { font-size: 9px; fill: var(--muted); }
.donut__legend { display: flex; flex: 1 1 170px; flex-direction: column; gap: 4px; min-width: 0; margin: 0; padding: 0; list-style: none; font-size: 12px; }
.donut__legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 3.2em; align-items: center; gap: 8px; }
.donut__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.donut__value, .donut__pct { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.donut__value { color: var(--muted); }
.donut__pct { font-weight: 600; }
.donut__slice--1 { stroke: var(--cat-1); } .donut__swatch--1 { background: var(--cat-1); }
.donut__slice--2 { stroke: var(--cat-2); } .donut__swatch--2 { background: var(--cat-2); }
.donut__slice--3 { stroke: var(--cat-3); } .donut__swatch--3 { background: var(--cat-3); }
.donut__slice--4 { stroke: var(--cat-4); } .donut__swatch--4 { background: var(--cat-4); }
.donut__slice--5 { stroke: var(--cat-5); } .donut__swatch--5 { background: var(--cat-5); }
.donut__slice--rest { stroke: var(--cat-rest); } .donut__swatch--rest { background: var(--cat-rest); }

/* ==========================================================================
   Printing: only the report copied into .print-root is printed, always on the white palette
   ========================================================================== */
.print-root { display: none; }
@media print {
  @page { size: landscape; margin: 12mm; } /* report and overview always print in landscape */
  :root, :root[data-theme="dark"] {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f9f8f5; --border: #e4e0d8;
    --text: #1f1d1a; --muted: #6e6a62; --accent: #297828; --stage-title: #1d5fd1;
    --cost: #9a5b00; --cost-soft: #fbeed6; --accent-soft: #e3efe9; --accent-text: #ffffff;
    --danger: #b4412f; --danger-soft: #f8e6e2; --done: #9a958c;
    --viz-1: #2a78d6;
    --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4;
    color-scheme: light;
  }
  body { background: #fff; }
  body > :not(.print-root) { display: none !important; }
  .print-root { display: block; color: var(--text); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .print-root__title { margin: 0; font-family: var(--font-display); font-size: 22px; }
  .print-root__subtitle { margin: 2px 0 16px; color: var(--muted); }
  .print-root .report__print { display: none; }
  .print-root .report__scroll { overflow: visible; }
  .print-root .report__charts { grid-template-columns: 1fr 1fr; }
  .print-root .report__heading { break-after: avoid; }
  .print-root tr, .print-root .chart { break-inside: avoid; }
}


/* ==========================================================================
   Block: editable (inline contenteditable text)
   ========================================================================== */
.editable {
  border-radius: 6px;
  outline: none;
  transition: background .15s, box-shadow .15s;
}
.editable:hover { background: var(--surface-2); }
.editable:focus { background: var(--surface); box-shadow: 0 0 0 2px var(--accent); }
.editable:empty::before { content: attr(data-placeholder); color: var(--done); }

/* ==========================================================================
   Block: switcher (pick a saved checklist)
   ========================================================================== */
.switcher { position: relative; }
.switcher__count {
  min-width: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-size: 12px;
  line-height: 18px;
  text-align: center;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.switcher__chevron { transition: transform .15s; }
.switcher__toggle[aria-expanded="true"] .switcher__chevron { transform: rotate(180deg); }
.switcher__panel {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 20;
  width: min(440px, calc(100vw - 40px));
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 16px 48px rgba(0, 0, 0, .18);
  overflow: hidden;
  animation: pop-in .15s ease;
}
.switcher__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 10px 10px 14px;
  border-bottom: 1px solid var(--border);
}
.switcher__heading {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--muted);
}
.switcher__new { padding: 6px 12px; }
.switcher__actions { display: flex; align-items: center; gap: 6px; }
.switcher__delete-all { padding: 6px 10px; color: var(--danger); }
.switcher__delete-all:hover { background: var(--danger-soft); color: var(--danger); }
.switcher__list {
  list-style: none;
  margin: 0;
  padding: 6px;
  max-height: min(60vh, 420px);
  overflow-y: auto;
}
.switcher__item { display: flex; align-items: center; gap: 4px; border-radius: var(--radius-sm); }
.switcher__item:hover { background: var(--surface-2); }
.switcher__item--active,
.switcher__item--active:hover { background: var(--accent-soft); }
.switcher__select {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 10px;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  border-radius: var(--radius-sm);
}
.switcher__select:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.switcher__title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.switcher__item--active .switcher__title { color: var(--accent); }
.switcher__id { font: 12px/1.4 var(--font-mono); color: var(--muted); }
.switcher__info { font-size: 12px; color: var(--muted); }
.switcher__delete { flex: none; margin-right: 4px; }

/* ==========================================================================
   Block: checklist-id (badge with the current checklist id, click to copy)
   ========================================================================== */
.checklist-id {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 4px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  cursor: pointer;
}
.checklist-id:hover { border-color: var(--muted); color: var(--text); }
.checklist-id:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.checklist-id__label {
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--surface-2);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .05em;
}
.checklist-id__value { font: 12px/1.4 var(--font-mono); }

/* ==========================================================================
   Block: progress
   ========================================================================== */
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.progress__track { flex: 1; height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
.progress__bar { height: 100%; border-radius: inherit; background: var(--accent); transition: width .3s ease; }
.progress__label { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Block: stage
   ========================================================================== */
.stage {
  margin-bottom: 28px;
  padding: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.stage__header { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.stage__heading { flex: 1 1 260px; min-width: 0; }
.stage__title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 600;
  line-height: 1.25;
  color: var(--stage-title);
  overflow-wrap: anywhere;
}
.stage__description { margin: 4px 0 0; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.stage__actions { display: flex; align-items: center; gap: 2px; }
.stage__grid {
  display: grid;
  grid-template-columns: repeat(var(--columns, 3), minmax(0, 1fr));
  gap: 12px;
}
.stage__empty {
  grid-column: 1 / -1;
  padding: 24px;
  border: 1px dashed var(--border);
  border-radius: var(--radius-sm);
  text-align: center;
  color: var(--muted);
}
/* Dense grids (5–7 columns): item buttons move to their own row above the title
   so narrow columns keep room for the title */
.stage__grid--dense .item__top { flex-wrap: wrap; row-gap: 0; }
.stage__grid--dense .item__actions { order: -1; flex-basis: 100%; margin: 0 0 0 24px; }
.stage__grid--dense .item__action { width: 24px; height: 22px; }
@media (max-width: 1200px) {
  .stage__grid { grid-template-columns: repeat(min(var(--columns, 3), 4), minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .stage__grid { grid-template-columns: repeat(min(var(--columns, 3), 2), minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .stage__grid { grid-template-columns: minmax(0, 1fr); }
  .stage { padding: 16px; }
}

/* "Simple" themes (White Simple / Black Simple):
   borderless stages on a plain surface (white in White Simple), borderless items */
/* Simple layout: stage info on the left (title → description → options),
   items on the right, in the same row; no side padding */
:root[data-style="simple"] .stage {
  display: grid;
  grid-template-columns: minmax(170px, 230px) minmax(0, 1fr);
  align-items: start;
  gap: 20px;
  margin-bottom: 12px;      /* stages no longer share the page colour → keep them apart */
  padding: 0 0 0 16px;     /* room before the stage title */
  border-radius: 0;
  background: var(--surface);
  border-color: transparent;
  box-shadow: none;
}
:root[data-style="simple"] { --item-actions-h: 20px; } /* height of the item button row above each title */
:root[data-style="simple"] .stage__header {
  flex-direction: column;
  flex-wrap: nowrap;
  align-items: stretch;
  gap: 4px;
  margin-bottom: 0;
  /* push the stage title down past the item button row so it lines up with the checkboxes */
  /* title line (28px) centred on the checkbox (centre at 20px + 11px) */
  padding-top: calc(var(--item-actions-h) - 3px);
}
:root[data-style="simple"] .stage__heading { flex: none; }
:root[data-style="simple"] .stage__actions { flex-wrap: wrap; margin-left: -6px; }
/* Compact: smaller stage type and tighter spacing */
:root[data-style="simple"] .stage__title { font-size: 22px; line-height: 28px; }
:root[data-style="simple"] .stage__description { margin-top: 2px; font-size: 13px; line-height: 1.45; }
:root[data-style="simple"] .stage__actions .button--icon { width: 26px; height: 24px; padding: 0; justify-content: center; }
:root[data-style="simple"] .stage__empty { padding: 10px; font-size: 13px; }
:root[data-style="simple"] .item { gap: 2px; }
:root[data-style="simple"] .item__meta { margin-top: 0; }
:root[data-style="simple"] .item__title { font-size: 14px; }
:root[data-style="simple"] .item__description { font-size: 13px; line-height: 1.45; }
:root[data-style="simple"] .item__notes-preview { margin-top: 2px; padding: 4px 8px; font-size: 12px; background: var(--surface-2); }
:root[data-style="simple"] .attachment__open { background: var(--surface-2); }
:root[data-style="simple"] .attachment__open:hover { background: var(--accent-soft); }
:root[data-style="simple"] .item,
:root[data-style="simple"] .item:hover,
:root[data-style="simple"] .item--done {
  padding: 0;
  background: transparent;
  border-color: transparent;
}
:root[data-style="simple"] .item__notes--filled::after { box-shadow: 0 0 0 2px var(--surface); }
:root[data-style="simple"] .stage__grid { gap: 8px 20px; }
/* Item buttons on their own row above the title (aligned with the title text) */
:root[data-style="simple"] .item__top { flex-wrap: wrap; row-gap: 0; }
:root[data-style="simple"] .item__actions {
  order: -1;
  flex-basis: 100%;
  margin: 0 0 0 24px;
}
:root[data-style="simple"] .item__action { width: 24px; height: var(--item-actions-h); }
@media (hover: hover) {
  /* Stage buttons appear only while hovering the stage info (title, description, progress) */
  :root[data-style="simple"] .stage__actions { opacity: 0; transition: opacity .15s; }
  :root[data-style="simple"] .stage__header:hover .stage__actions,
  :root[data-style="simple"] .stage__header:focus-within .stage__actions { opacity: 1; }
}
@media (max-width: 720px) {
  /* not enough room side by side: stack info above the items */
  :root[data-style="simple"] .stage { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  :root[data-style="simple"] .stage__header { padding-top: 0; }
}

/* ==========================================================================
   Block: add-stage
   ========================================================================== */
.add-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 18px;
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
}
.add-stage:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.add-stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ==========================================================================
   Block: item (a checkbox within a stage)
   ========================================================================== */
.item {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  transition: border-color .15s, background .15s;
}
.item:hover { border-color: var(--muted); }
.item--done { background: var(--accent-soft); border-color: transparent; opacity: .5; }
.item__top { display: flex; align-items: flex-start; gap: 10px; }
.item__check {
  flex: none;
  appearance: none;
  width: 20px;
  height: 20px;
  margin: 1px 0 0;
  border: 2px solid var(--muted);
  border-radius: 6px;
  background: var(--surface);
  cursor: pointer;
  display: grid;
  place-content: center;
  transition: background .15s, border-color .15s;
}
.item__check::after {
  content: "";
  width: 10px;
  height: 6px;
  border-left: 2px solid var(--accent-text);
  border-bottom: 2px solid var(--accent-text);
  transform: rotate(-45deg) translate(1px, -1px) scale(0);
  transition: transform .15s ease;
}
.item__check:checked { background: var(--accent); border-color: var(--accent); }
.item__check:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); }
.item__check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.item__title {
  flex: 1;
  min-width: 0;
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.4;
  /* single line: full title if it fits, otherwise ends with … (full title in the hover tooltip) */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.item--done .item__title { color: var(--done); text-decoration: line-through; }
.item__actions { display: flex; flex: none; align-items: center; margin: -4px -6px 0 0; }
.item__action { position: relative; width: 28px; height: 28px; padding: 0; justify-content: center; }
.item__action:disabled { cursor: default; background: transparent; }
/* Item buttons appear only while hovering (or keyboard-focusing) the item, in every theme.
   Space stays reserved → no layout shift.
   Touch screens (no hover) always show them. */
@media (hover: hover) {
  .item__action,
  .item__action:disabled { opacity: 0; transition: opacity .15s; }
  .item:hover .item__action,
  .item:focus-within .item__action { opacity: 1; }
}
.item:hover .item__action:disabled,
.item:focus-within .item__action:disabled { opacity: .25; }
@media (hover: none) { .item__action:disabled { opacity: .25; } }
.item__notes--filled { color: var(--accent); }
.item__notes--filled::after {
  content: "";
  position: absolute;
  top: 4px;
  right: 4px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--surface-2);
}
.item--done .item__notes--filled::after { box-shadow: 0 0 0 2px var(--accent-soft); }
.item__description {
  margin: 0 0 0 30px;
  color: var(--muted);
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.item__notes-preview {
  margin: 0 0 0 30px;
  padding: 8px 10px;
  border-left: 3px solid var(--accent);
  background: var(--surface);
  border-radius: 0 6px 6px 0;
  font-size: 13px;
  cursor: pointer;
}
/* first line only; ends with … when it doesn't fit (or the note has more lines) */
.item__notes-text {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* Auto-generated, read-only created / updated dates (notes & attachments) */
.timestamps {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.35;
  font-variant-numeric: tabular-nums;
}
.item--dragover { outline: 2px dashed var(--accent); outline-offset: 2px; }
/* total time logged on the item (click → time log) */
.item__meta { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 0 30px; }   /* directly below the title, aligned with the title text */
.item__time,
.item__cost {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 8px 1px 6px;
  border: 0;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  line-height: 18px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  cursor: pointer;
}
.item__time .button__icon,
.item__cost .button__icon { width: 12px; height: 12px; }
.item__time:hover,
.item__cost:hover { filter: brightness(.96); }
.item__time:focus-visible,
.item__cost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.item__cost { background: var(--cost-soft); color: var(--cost); }
.item--done .item__time,
.item--done .item__cost { background: var(--surface); }

/* ==========================================================================
   Block: time-log (Log time modal)
   ========================================================================== */
.time-log { display: flex; flex-direction: column; gap: 14px; }
.time-log__inputs { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 10px; align-items: end; }
.time-log__inputs--cost { grid-template-columns: minmax(0, 1fr) 150px 120px; }
@media (max-width: 480px) { .time-log__inputs--cost { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.time-log__type {
  flex: none;
  padding: 0 6px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  line-height: 18px;
  text-transform: uppercase;
  letter-spacing: .03em;
}
.time-log__summary {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 600;
}
.time-log__total { font-variant-numeric: tabular-nums; color: var(--accent); }
.time-log__list { list-style: none; margin: -8px 0 0; padding: 0; max-height: 220px; overflow-y: auto; }
.time-log__entry { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.time-log__amount { flex: none; min-width: 60px; font-weight: 600; font-variant-numeric: tabular-nums; }
.time-log__note { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time-log__person { flex: none; max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; font-weight: 600; }
.time-log__date { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.time-log__remove { flex: none; width: 24px; height: 24px; padding: 0; justify-content: center; }
.time-log__empty { margin: -8px 0 0; font-size: 13px; color: var(--muted); }
/* optional cost of a time entry */
.time-log__cost { display: flex; flex-direction: column; gap: 10px; min-width: 0; margin: 0; padding: 4px 12px 12px; border: 1px dashed var(--border); border-radius: var(--radius-sm); }
.time-log__cost-title { padding: 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.time-log__inputs--rate { grid-template-columns: minmax(0, 1fr) 96px 120px 130px; }
@media (max-width: 560px) { .time-log__inputs--rate { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.time-log__preview { margin: 0; min-height: 1.5em; font-size: 13px; color: var(--muted); }
.time-log__preview strong { color: var(--cost); }
/* link between a time entry and its cost */
.time-log__link {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 0 6px;
  border-radius: 4px;
  background: var(--cost-soft);
  color: var(--cost);
  font-size: 12px;
  font-weight: 600;
  line-height: 18px;
  font-variant-numeric: tabular-nums;
}
.time-log__link .button__icon { width: 12px; height: 12px; }
/* "also delete the linked entry?" asked inside the row */
.time-log__entry--confirm { flex-wrap: wrap; gap: 8px; margin: 4px 0; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--danger-soft); }
.time-log__confirm { flex: 1 1 100%; font-weight: 600; }
.time-log__choice { padding: 4px 10px; font-size: 13px; }
.item__attachments {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 0 0 0 30px;
  padding: 0;
  list-style: none;
}

/* ==========================================================================
   Block: attachment (a file attached to an item, rendered like a note)
   ========================================================================== */
.attachment { display: flex; align-items: center; gap: 2px; min-width: 0; }
.attachment__open {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px 4px 6px;
  border: 0;
  border-left: 3px solid var(--accent);
  border-radius: 0 6px 6px 0;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  transition: background .15s;
}
.attachment__open:hover { background: var(--accent-soft); }
.attachment__open:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.attachment__thumb,
.attachment__badge {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 4px;
  overflow: hidden;
}
.attachment__thumb { background: var(--surface-2); border: 1px solid var(--border); }
.attachment__thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.attachment__badge {
  display: grid;
  place-content: center;
  color: #fff;
  font: 700 9px/1 var(--font-mono);
  letter-spacing: .03em;
  background: var(--muted);
}
.attachment__badge--pdf { background: #c8432f; }
.attachment__badge--zip { background: #8a6a2f; }
.attachment__info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.attachment__line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.attachment__info .timestamps { margin-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attachment__name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attachment__size { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.attachment__remove { flex: none; width: 24px; height: 24px; padding: 0; justify-content: center; }
.attachment--missing .attachment__open { opacity: .55; cursor: help; }
.attachment--missing .attachment__size::after { content: " · missing"; }
@media (hover: hover) {
  .attachment__remove { opacity: 0; transition: opacity .15s; }
  .attachment:hover .attachment__remove,
  .attachment:focus-within .attachment__remove { opacity: 1; }
}
/* Preview popup (images & PDFs) */
.attachment-preview {
  display: grid;
  place-items: center;
  min-height: 160px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  overflow: hidden;
}
.attachment-preview__img { display: block; max-width: 100%; max-height: 70vh; object-fit: contain; }
.attachment-preview__frame { display: block; width: 100%; height: 75vh; border: 0; background: #fff; }

/* ==========================================================================
   Block: empty-state
   ========================================================================== */
.empty-state {
  padding: 56px 24px;
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--muted);
}
.empty-state__title { margin: 0 0 6px; font-family: var(--font-display); font-size: 22px; color: var(--text); }
.empty-state__text { margin: 0 0 18px; }

/* ==========================================================================
   Block: modal (native <dialog>)
   ========================================================================== */
.modal {
  width: min(520px, calc(100vw - 32px));
  padding: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
}
.modal--wide { width: min(1000px, calc(100vw - 32px)); }
.modal::backdrop { background: rgba(20, 18, 15, .45); backdrop-filter: blur(2px); }
.modal[open] { animation: pop-in .18s ease; }
@keyframes pop-in {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to { opacity: 1; transform: none; }
}
.modal__form { display: flex; flex-direction: column; }
.modal__header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 0; }
.modal__title { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.modal__subtitle { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.modal__body { display: flex; flex-direction: column; gap: 14px; padding: 16px 20px; }
.modal__message { margin: 0; color: var(--muted); }
.modal__message strong { color: var(--text); }
.modal__footer {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 0 0 var(--radius) var(--radius);
}

/* ==========================================================================
   Block: field
   ========================================================================== */
.field { display: flex; flex-direction: column; gap: 6px; }
.field__label { font-size: 13px; font-weight: 600; }
.field__input,
.field__select,
.field__textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  transition: border-color .15s, box-shadow .15s;
}
.field__textarea { min-height: 96px; resize: vertical; }

/* ==========================================================================
   Block: autocomplete (suggestions list under the Person input, styled like a select's options)
   ========================================================================== */
.person-field { position: relative; }
.autocomplete {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 5;
  margin: 4px 0 0;
  padding: 4px;
  list-style: none;
  max-height: 200px;
  overflow-y: auto;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
}
.autocomplete__option {
  padding: 6px 10px;
  border-radius: 6px;
  color: var(--text);
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.autocomplete__option:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.autocomplete__option--active,
.autocomplete__option--active:hover { background: var(--accent); color: var(--accent-text); }
.autocomplete__match { font-weight: 700; }
.field__select { cursor: pointer; }
.field__textarea--tall { min-height: 200px; }
.field__input:focus,
.field__select:focus,
.field__textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
/* Checkbox field rendered as a toggle row */
.field--toggle {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  cursor: pointer;
}
.field--toggle:hover { border-color: var(--muted); }
.field__text { display: flex; flex-direction: column; gap: 2px; }
.field__hint { font-size: 13px; color: var(--muted); }
.field__switch {
  flex: none;
  position: relative;
  appearance: none;
  width: 40px;
  height: 24px;
  margin: 0;
  border-radius: 999px;
  background: var(--border);
  cursor: pointer;
  transition: background .15s;
}
.field__switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
  transition: transform .15s ease;
}
.field__switch:checked { background: var(--accent); }
.field__switch:checked::after { transform: translateX(16px); }
.field__switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ==========================================================================
   Block: pick-list (multi-select list of checklists, used by Export)
   ========================================================================== */
.pick-list { display: flex; flex-direction: column; gap: 8px; }
.pick-list__bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pick-list__count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pick-list__toggle { padding: 4px 10px; color: var(--accent); }
.pick-list__items {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: min(50vh, 360px);
  overflow-y: auto;
}
.pick-list__row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.pick-list__row:hover { border-color: var(--muted); }
.pick-list__row--checked { border-color: var(--accent); background: var(--accent-soft); }
.pick-list__check {
  flex: none;
  appearance: none;
  width: 18px;
  height: 18px;
  margin: 2px 0 0;
  border: 2px solid var(--muted);
  border-radius: 5px;
  background: var(--surface);
  display: grid;
  place-content: center;
  cursor: pointer;
}
.pick-list__check::after {
  content: "";
  width: 9px;
  height: 5px;
  border-left: 2px solid var(--accent-text);
  border-bottom: 2px solid var(--accent-text);
  transform: rotate(-45deg) translate(1px, -1px) scale(0);
  transition: transform .12s ease;
}
.pick-list__check:checked { background: var(--accent); border-color: var(--accent); }
.pick-list__check:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); }
.pick-list__check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pick-list__text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pick-list__title { display: flex; align-items: center; gap: 8px; font-weight: 600; overflow-wrap: anywhere; }
.pick-list__badge {
  flex: none;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 11px;
  font-weight: 600;
  line-height: 18px;
}
.pick-list__meta { font-size: 12px; color: var(--muted); }
.pick-list__id { font: 12px var(--font-mono); }

/* ==========================================================================
   Block: toast
   ========================================================================== */
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 100;
  max-width: calc(100vw - 32px);
  padding: 10px 16px;
  border-radius: 999px;
  background: var(--text);
  color: var(--bg);
  font-size: 14px;
  box-shadow: var(--shadow);
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.toast--visible { opacity: 1; transform: translate(-50%, 0); }
.toast--error { background: var(--danger); color: #fff; }

/* ==========================================================================
   Block: lang (UI language picker in the toolbar: flag + code, dropdown of languages)
   ========================================================================== */
.lang { position: relative; }
.lang__toggle { padding: 6px 10px; }
.lang__code { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
.lang__chevron { width: 14px; height: 14px; transition: transform .15s; }
.lang__toggle[aria-expanded="true"] .lang__chevron { transform: rotate(180deg); }
.lang__flag {
  display: inline-block;
  flex: none;
  width: 21px;
  height: 14px;
  border-radius: 2px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .15);
  line-height: 0;
}
.lang__flag svg { display: block; width: 100%; height: 100%; }
.lang__panel {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 20;
  min-width: 180px;
  margin: 0;
  padding: 6px;
  list-style: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 16px 48px rgba(0, 0, 0, .18);
  animation: pop-in .15s ease;
}
.lang__option {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--text);
  font: inherit;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
}
.lang__option:hover { background: var(--surface-2); }
.lang__option:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.lang__option[aria-checked="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* ==========================================================================
   Block: tour (first-run tutorial)
   ========================================================================== */
.toolbar__help-label { display: none; }
.toolbar--compact.toolbar--open .toolbar__help { width: auto; height: auto; padding: 8px 14px; gap: 6px; }
.toolbar--compact.toolbar--open .toolbar__help-label { display: inline; }
.tour { position: fixed; inset: 0; z-index: 40; }
.tour__spot {
  position: fixed;
  border-radius: 10px;
  box-shadow: 0 0 0 9999px rgba(20, 18, 15, .55);
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  pointer-events: none;
  transition: top .25s ease, left .25s ease, width .25s ease, height .25s ease;
}
.tour__spot--none { top: 50%; left: 50%; width: 0; height: 0; outline: 0; }
.tour__bubble {
  position: fixed;
  width: min(340px, calc(100vw - 24px));
  padding: 16px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 16px 48px rgba(0, 0, 0, .25);
  transition: top .25s ease, left .25s ease;
}
.tour__count { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tour__title { margin: 0 0 6px; font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.tour__text { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
.tour__nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tour__spacer { flex: 1; }
.tour__skip { padding-left: 0; }
@media (prefers-reduced-motion: reduce) { .tour__spot, .tour__bubble { transition: none; } }
/* while touring, buttons that normally appear only on hover stay visible */
:root.tour-on .stage__actions,
:root.tour-on .item__action:not(:disabled) { opacity: 1; }
</style>

      donut_rest: 'ещё {n}',
      chart_cost_person_share: 'Доля расходов по исполнителям · {currency}'
    }
  };

  let lang = DEFAULT_LANG;
  const fill = (s, params) => String(s).replace(/\{(\w+)\}/g, (m, k) => (params && k in params ? params[k] : m));
  function t(key, params) {
    const dict = STRINGS[lang] || STRINGS[DEFAULT_LANG];
    const s = key in dict ? dict[key] : STRINGS[DEFAULT_LANG][key];
    return fill(s == null ? key : s, params);
  }
  const pluralRules = {};
  function tn(key, n, params) {
    const dict = STRINGS[lang] || STRINGS[DEFAULT_LANG];
    const forms = dict[key] || STRINGS[DEFAULT_LANG][key];
    let cat = 'other';
    try { cat = (pluralRules[lang] || (pluralRules[lang] = new Intl.PluralRules(lang))).select(n); } catch (e) { cat = n === 1 ? 'one' : 'other'; }
    return fill(forms[cat] || forms.other, Object.assign({ n }, params));
  }

  // Swap an item with its neighbour (order = reading order: left→right, then next row)
  function moveItem(stage, item, dir, action) {
    const i = stage.items.indexOf(item);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= stage.items.length) return;
    [stage.items[i], stage.items[j]] = [stage.items[j], stage.items[i]];
    commit();
    // keep keyboard focus on the moved item's button so it can be moved repeatedly
    const btn = stagesEl.querySelector(`[data-item="${CSS.escape(item.id)}"] [data-action="${action}"]`);
    if (btn && !btn.disabled) btn.focus({ preventScroll: true });
  }

  /* ==================================================================
     Storage keys & constants
     ================================================================== */
  const LEGACY_KEY = 'checklist-app:data';        // very first single-checklist format (migrated)
  const CHECKLIST_PREFIX = 'checklist-app:doc:';  // one entry per checklist: <prefix><id>
  const ACTIVE_KEY = 'checklist-app:active';      // id of the last opened checklist
  const PREFS_KEY = 'checklist-app:prefs';        // display settings

  /* ==================================================================
     Safe localStorage wrapper (storage can be blocked or full)
     ================================================================== */
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    remove(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
    keys() { try { return Object.keys(localStorage); } catch (e) { return []; } }
  };

  /* ==================================================================
     Ids
     - Checklists: exactly 8 chars [a-z0-9], unique among saved checklists
     - Stages/items: internal ids, unique within their checklist
     ================================================================== */
  const ID_LENGTH = 8;
  const ID_ALPHABET = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const isValidId = (id) => typeof id === 'string' && /^[a-z0-9]{8}$/.test(id);

  function randomId() {
    let out = '';
    const buf = new Uint8Array(16);
    while (out.length < ID_LENGTH) {
      if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(buf);
      else for (let i = 0; i < buf.length; i++) buf[i] = (Math.random() * 256) | 0;
      for (const byte of buf) {
        // rejection sampling: 252 = 36 * 7, so every character is equally likely
        if (byte < 252 && out.length < ID_LENGTH) out += ID_ALPHABET[byte % 36];
      }
    }
    return out;
  }

  const savedIds = () => store.keys().filter((k) => k.startsWith(CHECKLIST_PREFIX)).map((k) => k.slice(CHECKLIST_PREFIX.length));

  // Generate ids until one isn't used by a saved checklist (or listed in `reserved`)
  function newChecklistId(reserved = []) {
    const taken = new Set(savedIds().concat(reserved));
    let id;
    do { id = randomId(); } while (taken.has(id));
    return id;
  }

  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  /* ==================================================================
     Data model & normalisation
     Checklist: { id, title, description, updatedAt, stages: [Stage], persons: [Person], defaultTemplate? }
                — defaultTemplate = language of the untouched default checklist (see "Default checklist")
     Stage:     { id, title, description, columns (1–7), items: [Item] }
     Item:      { id, title, description, done, notes, attachments: [Attachment], timeLogs: [TimeLog] }
     TimeLog:   { id, minutes, note, loggedAt, personId, costId }
     Cost:      { id, type (fuel | food | product | labor | service | other), amount, currency (ISO 4217, default EUR), note, loggedAt, personId, timeLogId }
                — costId / timeLogId link a time entry and its cost (one each, same item; '' when not linked)
     Person:    { id, name, rate? }  — unique name per checklist; 'unknown' when no person was given;
                rate = { amount, currency }: the last hourly rate used for this person (see "Persons")
     Attachment:{ id, name, type, size }  — the file itself lives in IndexedDB (see "Attachments")
     ================================================================== */
  const str = (v) => (typeof v === 'string' ? v : v == null ? '' : String(v));

  const MAX_COLUMNS = 7;
  const COLUMN_OPTIONS = Array.from({ length: MAX_COLUMNS }, (_, i) => i + 1);
  const parseColumns = (v) => (COLUMN_OPTIONS.includes(Number(v)) ? Number(v) : 3);
  const NEW_STAGE_COLUMNS = 5;   // pre-selected in the "New stage" dialog

  function normalizeItem(i) {
    i = i || {};
    return normalizeLinks({
      id: str(i.id) || uid(),
      title: str(i.title) || t('untitled_item'),
      description: str(i.description),
      done: Boolean(i.done),
      notes: str(i.notes),
      notesCreatedAt: i.notes ? isoDate(i.notesCreatedAt) : '',
      notesUpdatedAt: i.notes ? isoDate(i.notesUpdatedAt || i.notesCreatedAt) : '',
      attachments: Array.isArray(i.attachments) ? i.attachments.filter(isAttachmentMeta).map(normalizeAttachment) : [],
      timeLogs: Array.isArray(i.timeLogs) ? i.timeLogs.map(normalizeTimeLog).filter(Boolean) : [],
      costs: Array.isArray(i.costs) ? i.costs.map(normalizeCost).filter(Boolean) : []
    });
  }

  // Time entry ↔ cost links: at most one cost per time entry, within the same item, stored on
  // both sides (timeLog.costId, cost.timeLogId). Broken or one-sided links are repaired or dropped.
  function normalizeLinks(item) {
    const costs = new Map(item.costs.map((c) => [c.id, c]));
    const logs = new Map(item.timeLogs.map((l) => [l.id, l]));
    const costOfLog = new Map(); // log id → cost id
    const linkedCosts = new Set();
    const pair = (logId, costId) => { costOfLog.set(logId, costId); linkedCosts.add(costId); };
    item.timeLogs.forEach((l) => {
      const c = costs.get(l.costId);
      if (c && !linkedCosts.has(c.id) && (!c.timeLogId || c.timeLogId === l.id)) pair(l.id, c.id);
    });
    item.costs.forEach((c) => {
      if (!linkedCosts.has(c.id) && logs.has(c.timeLogId) && !costOfLog.has(c.timeLogId)) pair(c.timeLogId, c.id);
    });
    item.timeLogs.forEach((l) => { l.costId = costOfLog.get(l.id) || ''; });
    item.costs.forEach((c) => { if (!linkedCosts.has(c.id)) c.timeLogId = ''; });
    costOfLog.forEach((costId, logId) => { costs.get(costId).timeLogId = logId; });
    return item;
  }

  /* ---- Costs ---- */
  // 'fuel' is shown as "Transport" (id kept so saved and exported costs stay compatible)
  const COST_TYPES = [{ id: 'fuel' }, { id: 'food' }, { id: 'product' }, { id: 'labor' }, { id: 'service' }, { id: 'other' }];
  const costTypeLabel = (id) => t('cost_' + (COST_TYPES.some((x) => x.id === id) ? id : 'other'));
  const CURRENCIES = ['EUR', 'USD', 'GBP', 'JPY', 'CHF', 'CAD', 'AUD', 'NZD', 'CNY', 'HKD', 'SGD', 'KRW', 'INR',
    'SEK', 'NOK', 'DKK', 'ISK', 'PLN', 'CZK', 'HUF', 'RON', 'TRY', 'UAH', 'RUB', 'ILS', 'AED', 'SAR', 'QAR', 'EGP',
    'ZAR', 'NGN', 'KES', 'MAD', 'BRL', 'MXN', 'ARS', 'CLP', 'COP', 'PEN', 'UYU', 'TWD', 'THB', 'IDR', 'MYR', 'PHP', 'VND'];
  const DEFAULT_CURRENCY = 'EUR';
  const round2 = (n) => Math.round(n * 100) / 100;
  function normalizeCost(c) {
    if (!c || typeof c !== 'object') return null;
    const amount = round2(Number(c.amount));
    if (!(amount > 0) || !isFinite(amount)) return null;
    const currency = str(c.currency).toUpperCase();
    return {
      id: str(c.id) || uid(),
      type: COST_TYPES.some((t) => t.id === c.type) ? c.type : 'other',
      amount,
      currency: /^[A-Z]{3}$/.test(currency) ? currency : DEFAULT_CURRENCY,
      note: str(c.note),
      loggedAt: isoDate(c.loggedAt),
      personId: str(c.personId),
      timeLogId: str(c.timeLogId)
    };
  }
  // Totals per currency (amounts in different currencies are never added together)
  function sumCosts(items) {
    const totals = new Map();
    items.forEach((i) => i.costs.forEach((c) => totals.set(c.currency, round2((totals.get(c.currency) || 0) + c.amount))));
    return Array.from(totals, ([currency, amount]) => ({ currency, amount }));
  }
  function formatMoney(amount, currency) {
    try { return new Intl.NumberFormat(undefined, { style: 'currency', currency }).format(amount); }
    catch (e) { return `${amount.toFixed(2)} ${currency}`; }
  }
  const formatCostTotals = (totals) => totals.map((t) => formatMoney(t.amount, t.currency)).join(' + ');

  function normalizeTimeLog(t) {
    if (!t || typeof t !== 'object') return null;
    const minutes = Math.round(Number(t.minutes));
    if (!(minutes > 0)) return null;
    return { id: str(t.id) || uid(), minutes, note: str(t.note), loggedAt: isoDate(t.loggedAt), personId: str(t.personId), costId: str(t.costId) };
  }
  const sumMinutes = (items) => items.reduce((sum, i) => sum + i.timeLogs.reduce((s, t) => s + t.minutes, 0), 0);
  // 45 → "45m", 90 → "1h 30m", 120 → "2h"
  function formatDuration(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
  }

  const isFileId = (id) => typeof id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(id);
  const isAttachmentMeta = (a) => a && typeof a === 'object' && isFileId(a.id);
  const normalizeAttachment = (a) => ({
    id: a.id,
    name: str(a.name) || 'file',
    type: str(a.type),
    size: Math.max(0, Number(a.size) || 0),
    createdAt: isoDate(a.createdAt),
    updatedAt: isoDate(a.updatedAt || a.createdAt)
  });
  // Keep only valid date strings (stored as ISO 8601)
  const isoDate = (v) => {
    if (typeof v !== 'string' || !v) return '';
    const d = new Date(v);
    return isNaN(d) ? '' : d.toISOString();
  };

  function normalizeStage(s) {
    s = s || {};
    return {
      id: str(s.id) || uid(),
      title: str(s.title) || t('untitled_stage'),
      description: str(s.description),
      columns: parseColumns(s.columns),
      items: Array.isArray(s.items) ? s.items.map(normalizeItem) : []
    };
  }

  // Errors whose message is safe to show to the user as-is (already translated)
  const userError = (key) => Object.assign(new Error(t(key)), { userFacing: true });

  /* ---- Persons: who logged each time / cost entry ----
     Every checklist keeps its own list of people (persons: [{ id, name }]); time logs and
     costs link to one of them by personId. Names are unique within a checklist: they are
     compared ignoring case and repeated spaces, so typing an existing name always reuses
     that person. Entries without a person link to the person named 'unknown' (stored as
     'unknown', shown translated). People no entry links to are dropped on save.
     A person may keep rate = { amount, currency }: the last hourly rate used for them when
     logging time with a cost "per hour" (filled in again next time that person is picked). */
  const UNKNOWN_PERSON = 'unknown';
  const cleanName = (s) => str(s).trim().replace(/\s+/g, ' ').slice(0, 80);
  const personKey = (s) => cleanName(s).toLocaleLowerCase();
  const newPersonId = () => 'p' + uid();
  const allLogs = (c) => c.stages.flatMap((s) => s.items.flatMap((i) => i.timeLogs.concat(i.costs)));
  const isUnknown = (p) => !p || p.name === UNKNOWN_PERSON;
  const personName = (c, id) => { const p = c.persons.find((x) => x.id === id); return isUnknown(p) ? t('unknown_person') : p.name; };
  // People sorted by name, "unknown" last
  const sortedPersons = (c) => c.persons.slice().sort((a, b) =>
    (isUnknown(a) - isUnknown(b)) || a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

  // Empty input, 'unknown' or the word for unknown in the current language
  const isUnknownWord = (key) => !key || key === UNKNOWN_PERSON || key === personKey(t('unknown_person'));
  // The existing person a typed name refers to, or null when it would be a new person.
  // A real person with that name always wins, even if it matches the translated word for unknown
  // (e.g. someone called "Desconocido" while the app is in Spanish).
  function findPerson(c, name) {
    const key = personKey(name);
    const real = key && key !== UNKNOWN_PERSON ? c.persons.find((x) => !isUnknown(x) && personKey(x.name) === key) : null;
    return real || (isUnknownWord(key) ? c.persons.find((x) => isUnknown(x)) || null : null);
  }
  // The person with this name in checklist `c`, added if new. Never creates a duplicate name.
  function personFor(c, name) {
    const found = findPerson(c, name);
    if (found) return found;
    const p = { id: newPersonId(), name: isUnknownWord(personKey(name)) ? UNKNOWN_PERSON : cleanName(name) };
    c.persons.push(p);
    return p;
  }

  // Build c.persons from raw data (merging duplicate names) and link every entry to a person
  function normalizePersons(c, rawPersons) {
    c.persons = [];
    const alias = new Map(); // raw person id → kept person id
    (Array.isArray(rawPersons) ? rawPersons : []).forEach((rp) => {
      if (!rp || typeof rp !== 'object') return;
      const key = personKey(rp.name);
      if (!key) return;
      const name = key === UNKNOWN_PERSON ? UNKNOWN_PERSON : cleanName(rp.name);
      let p = c.persons.find((x) => personKey(x.name) === key);
      if (!p) {
        const id = str(rp.id);
        p = { id: id && !c.persons.some((x) => x.id === id) ? id : newPersonId(), name };
        c.persons.push(p);
      }
      const rate = normalizeRate(rp.rate);
      if (rate && !p.rate) p.rate = rate;
      if (str(rp.id) && !alias.has(str(rp.id))) alias.set(str(rp.id), p.id);
    });
    allLogs(c).forEach((log) => { log.personId = alias.get(log.personId) || personFor(c, UNKNOWN_PERSON).id; });
    prunePersons(c);
  }
  function normalizeRate(r) {
    if (!r || typeof r !== 'object') return null;
    const amount = round2(Number(r.amount));
    const currency = str(r.currency).toUpperCase();
    return amount > 0 && isFinite(amount) && /^[A-Z]{3}$/.test(currency) ? { amount, currency } : null;
  }
  function prunePersons(c) {
    const used = new Set(allLogs(c).map((log) => log.personId));
    c.persons = c.persons.filter((p) => used.has(p.id));
  }

  function normalizeChecklist(raw, forcedId) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw userError('err_expected_object');
    // `checklists` was the old name for stages
    const rawStages = Array.isArray(raw.stages) ? raw.stages : Array.isArray(raw.checklists) ? raw.checklists : null;
    if (!rawStages) throw userError('err_stages_array');
    const c = {
      id: forcedId || (isValidId(raw.id) ? raw.id : newChecklistId()),
      title: str(raw.title),
      description: str(raw.description),
      updatedAt: str(raw.updatedAt),
      stages: rawStages.map(normalizeStage),
      defaultTemplate: isLang(raw.defaultTemplate) ? raw.defaultTemplate : '' // see "Default checklist"
    };
    normalizePersons(c, raw.persons);
    return c;
  }

  const blankChecklist = () => ({ id: newChecklistId(), title: t('untitled_checklist'), description: '', stages: [], persons: [] });

     Written in every UI language. It is created in the language detected on the first run and

  // The default checklist in language `l` (first item ticked, with the example note)
  const sampleChecklist = (l = lang) => {
    const tpl = TEMPLATES[l] || TEMPLATES[DEFAULT_LANG];
    const c = normalizeChecklist({
      id: newChecklistId(),
      title: tpl.title,
      description: tpl.description,
      stages: tpl.stages.map(([title, description, items], si) => ({
        id: uid(), title, description, columns: NEW_STAGE_COLUMNS,
        items: items.map(([itemTitle, itemDescription], ii) => (si === 0 && ii === 0
          ? { id: uid(), title: itemTitle, description: itemDescription, done: true, notes: tpl.note, notesCreatedAt: new Date().toISOString() }
          : { id: uid(), title: itemTitle, description: itemDescription, done: false, notes: '' }))
      }))
    });
    c.defaultTemplate = TEMPLATES[l] ? l : DEFAULT_LANG;
    return c;
  };

  // Still the original default checklist? Ticks and attachments are ignored; any other change counts.
  function isUntouchedTemplate(c) {
    const tpl = TEMPLATES[c.defaultTemplate];
    if (!tpl || c.title !== tpl.title || c.description !== tpl.description || c.stages.length !== tpl.stages.length) return false;
    return c.stages.every((stage, si) => {
      const [title, description, items] = tpl.stages[si];
      return stage.title === title && stage.description === description && stage.columns === NEW_STAGE_COLUMNS &&
        stage.items.length === items.length &&
        stage.items.every((item, ii) => item.title === items[ii][0] && item.description === items[ii][1] &&
          item.notes === (si === 0 && ii === 0 ? tpl.note : '') && !item.timeLogs.length && !item.costs.length);
    });
  }

  // Rewrite the texts of an untouched default checklist in language `l` (same ids, ticks and attachments)
  function translateTemplate(c, l) {
    const tpl = TEMPLATES[l];
    c.title = tpl.title;
    c.description = tpl.description;
    c.stages.forEach((stage, si) => {
      const [title, description, items] = tpl.stages[si];
      stage.title = title;
      stage.description = description;
      stage.items.forEach((item, ii) => {
        item.title = items[ii][0];
        item.description = items[ii][1];
        if (si === 0 && ii === 0) item.notes = tpl.note;
      });
    });
    c.defaultTemplate = l;
  }

  // Language switched: translate the default checklist if it is still the original,
  // otherwise it stops being the default checklist for good
  function translateDefaultChecklist(l) {
    savedIds().forEach((id) => {
      const c = id === checklist.id ? checklist : readChecklist(id);
      if (!c || !c.defaultTemplate || c.defaultTemplate === l) return;
      if (isUntouchedTemplate(c)) translateTemplate(c, l);
      else c.defaultTemplate = '';
      writeChecklistQuietly(c);
    });
  }

  /* ==================================================================
     Checklist persistence
     ================================================================== */
  function readChecklist(id) {
    const raw = store.get(CHECKLIST_PREFIX + id);
    if (!raw) return null;
    try { return normalizeChecklist(JSON.parse(raw), id); } catch (e) { return null; }
  }

  function checklistData(c) {
    prunePersons(c);
    const data = { id: c.id, title: c.title, description: c.description, updatedAt: c.updatedAt, stages: c.stages, persons: c.persons };
    if (c.defaultTemplate) data.defaultTemplate = c.defaultTemplate;
    return data;
  }
  function writeChecklist(c) {
    c.updatedAt = new Date().toISOString();
    return store.set(CHECKLIST_PREFIX + c.id, JSON.stringify(checklistData(c)));
  }
  // Save without touching updatedAt (not a user edit, e.g. translating the default checklist)
  function writeChecklistQuietly(c) {
    return store.set(CHECKLIST_PREFIX + c.id, JSON.stringify(checklistData(c)));
  }

  function listChecklists() {
    return savedIds().map(readChecklist).filter(Boolean)
      .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  }

  /* ---- Migrations from earlier versions of this app ---- */
  function migrateLegacy() {
    const raw = store.get(LEGACY_KEY);
    if (!raw) return;
    try {
      const c = normalizeChecklist(JSON.parse(raw));
      if (writeChecklist(c)) { store.set(ACTIVE_KEY, c.id); store.remove(LEGACY_KEY); }
    } catch (e) { store.remove(LEGACY_KEY); }
  }

  // Re-key saved checklists with an invalid id; rewrite old `checklists` field as `stages`
  function migrateSaved() {
    const active = store.get(ACTIVE_KEY);
    savedIds().forEach((oldId) => {
      const c = readChecklist(oldId);
      if (!c) return;
      if (!isValidId(oldId)) {
        c.id = newChecklistId();
        if (writeChecklist(c)) {
          store.remove(CHECKLIST_PREFIX + oldId);
          if (active === oldId) store.set(ACTIVE_KEY, c.id);
        }
      } else if (!/"stages"\s*:/.test(store.get(CHECKLIST_PREFIX + oldId) || '')) {
        const updatedAt = c.updatedAt;
        writeChecklist(c);
        // keep the original timestamp: migration isn't a user edit
        if (updatedAt) { c.updatedAt = updatedAt; store.set(CHECKLIST_PREFIX + c.id, JSON.stringify(c)); }
      }
    });
  }

  /* ---- Active checklist & URL hash (#<id>) ---- */
